<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tonight</title>
    <!-- Everything here comes from Television's shared styles, so the active theme restyles the whole card. -->
    <link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.5.0">
    <script type="module" src="/canonical/v2/components.js"></script>
    <style>
      body { margin: 0; }
      main {
        min-height: 100vh;
        box-sizing: border-box;
        display: grid;
        align-content: center;
        gap: 1.4rem;
        max-width: 760px;
        margin: 0 auto;
        padding: 2.5rem 16px;
      }
      .kicker { margin: 0; color: var(--color-text-muted); letter-spacing: .12em; text-transform: uppercase; font-size: .85rem; }
      h1 { margin: 0; font-size: clamp(2.6rem, 8vw, 5.2rem); line-height: 1; }
      h2 { margin: 0; font-size: clamp(1.4rem, 3.5vw, 2.2rem); color: var(--accent); }
      .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
      @media (max-width: 560px) { .details { grid-template-columns: 1fr; } }
      .details div {
        padding: 1rem;
        border: var(--panel-border, 1px solid var(--color-border));
        border-radius: var(--panel-radius, 10px);
        background: var(--color-surface-muted);
        box-shadow: var(--shadow-sm);
      }
      .details b { display: block; font-size: 1.6rem; }
      .details span { color: var(--color-text-muted); }
      .actions { display: flex; gap: .6rem; flex-wrap: wrap; }
    </style>
  </head>
  <body>
    <main text-display="prose">
      <p class="kicker">54 Washburn St · San Francisco</p>
      <h1>Adaptive Software</h1>
      <h2>Diff &amp; Demo</h2>
      <p>Eight short demos of software that is personal, playful and a little weird. Software as content, not productivity.</p>
      <div class="details">
        <div><b>5:30</b><span>Doors</span></div>
        <div><b>6:20</b><span>Welcome</span></div>
        <div><b>6:30</b><span>Demos</span></div>
      </div>
      <div class="actions">
        <button intent="primary" size="lg">I'm coming</button>
        <button size="lg">Bring a friend</button>
      </div>
    </main>
  </body>
</html>
