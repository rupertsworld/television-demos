<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Television</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; }
      #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      .tv {
        --size: min(62vmin, 460px);
        position: fixed; left: 50%; top: 50%;
        width: var(--size); height: var(--size);
        transform: translate(-50%, -50%);
        filter: drop-shadow(0 18px 40px rgb(0 0 0 / .55));
      }
      .tv svg, .tv canvas { position: absolute; display: block; }
      .tv svg { inset: 0; width: 100%; height: 100%; }
      /* The screen sits where the logo's stripes do: x 8.5–46.5, y 7.7–47.3 of a 55-unit box. */
      #screen {
        left: calc(var(--size) * 8.5 / 55); top: calc(var(--size) * 7.7 / 55);
        width: calc(var(--size) * 38 / 55); height: calc(var(--size) * 39.6 / 55);
        border-radius: calc(var(--size) * 5.7 / 55);
      }
    </style>
  </head>
  <body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="tv" role="img" aria-label="The Television logo: a TV set showing moving coloured stripes">
      <svg viewBox="0 0 55 55" aria-hidden="true">
        <defs>
          <linearGradient id="body" x1="27.5" y1="1.45" x2="27.5" y2="53.55" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#262626"/>
          </linearGradient>
        </defs>
        <path fill="url(#body)" d="M12.5,1.45h30c5.47,0,10.48,4.46,10.89,9.98.73,10.7.73,21.44,0,32.13-.41,5.52-5.42,9.98-10.89,9.98H12.5c-5.47,0-10.48-4.46-10.89-9.98-.73-10.7-.73-21.44,0-32.13C2.02,5.91,7.03,1.45,12.5,1.45Z"/>
      </svg>
      <canvas id="screen"></canvas>
      <svg viewBox="0 0 55 55" aria-hidden="true">
        <path fill="none" stroke="#fff" stroke-width="3" d="M14.2,8.74h26.6c2.56,0,5.25,2.06,5.8,4.64,1.89,9.31,1.89,18.91,0,28.23-.55,2.58-3.25,4.64-5.8,4.64H14.2c-2.56,0-5.25-2.06-5.8-4.64-1.89-9.31-1.89-18.91,0-28.23.55-2.58,3.25-4.64,5.8-4.64Z"/>
      </svg>
    </div>
    <script>
      // The logo's test-pattern stripes, left to right.
      const COLOURS = ["#ffcd27", "#40d2b3", "#38c428", "#ff01d0", "#d24043", "#0015ff"];
      const still = matchMedia("(prefers-reduced-motion: reduce)").matches;

      // Stripes scroll sideways in flat space, then bow outward around the middle,
      // like the curved outer stripes in the logo and the glass of an old CRT.
      function draw(canvas, { stripes, warp, speed, dim }, time) {
        const ratio = devicePixelRatio || 1;
        const w = canvas.clientWidth, h = canvas.clientHeight;
        if (canvas.width !== Math.round(w * ratio)) { canvas.width = Math.round(w * ratio); canvas.height = Math.round(h * ratio); }
        const ctx = canvas.getContext("2d");
        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
        const width = w / stripes;
        const offset = still ? 0 : (time * speed) % (width * COLOURS.length);
        const cx = w / 2;
        const bend = (x, y) => {
          const v = (y / h) * 2 - 1;
          return cx + (x - cx) * (1 + warp * (1 - v * v));
        };
        const steps = 48;
        for (let i = -COLOURS.length - 2; i * width < w * (1 + warp) + width * 2; i++) {
          const left = i * width + offset - w * warp / 2;
          ctx.beginPath();
          for (let s = 0; s <= steps; s++) { const y = (s / steps) * h; ctx.lineTo(bend(left, y), y); }
          for (let s = steps; s >= 0; s--) { const y = (s / steps) * h; ctx.lineTo(bend(left + width + 0.5, y), y); }
          ctx.closePath();
          ctx.fillStyle = COLOURS[((i % COLOURS.length) + COLOURS.length) % COLOURS.length];
          ctx.fill();
        }
        if (dim) { ctx.fillStyle = `rgb(0 0 0 / ${dim})`; ctx.fillRect(0, 0, w, h); }
      }

      const bg = document.getElementById("bg");
      const screen = document.getElementById("screen");
      function frame(time) {
        draw(bg, { stripes: 7, warp: 0.35, speed: 0.03, dim: 0.35 }, time);
        draw(screen, { stripes: 5.5, warp: 0.45, speed: 0.03, dim: 0 }, time);
        if (!still) requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      addEventListener("resize", () => requestAnimationFrame(frame));
    </script>
  </body>
</html>
