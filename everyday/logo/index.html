<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Television</title>
    <link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.5.0">
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: grid; place-items: center; background: var(--color-surface); }

  <body>
    <main>
      <img src="./television-wordmark.png" alt="Television: a CRT television set showing a test pattern">
      <p>A screen you share with your agent.</p>
    </main>
