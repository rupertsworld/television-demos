    <script id="files" type="application/json">{"fridge-poetry/README.md": "# Fridge poetry\n\nA Television directory artifact for a short live duet. Rupert drags a magnet from the jumble on the lower door into the poem area above; the page saves that move and asks one Claude Code session, through Dispatch, to place one more word. Moving a poem word or returning it to the lower door does not call the agent.\n\n## Set up\n\nRegister the folder on the desired Television channel:\n\n```sh\ntv create-path-artifact --channel <channel-id> --title \"Fridge poetry\" --path /root/workspace/dev/tv-demos/fridge-poetry --no-focus\n```\n\nEdit `config.json` with the Dispatch base URL and the target Claude Code conversation ID. Dispatch must allow the Television page origin through `DISPATCH_BROWSER_ORIGIN` when the request crosses origins. The page reads `config.json` from this folder; it puts no session ID in the JSON store. A successful HTTP 202 means Dispatch submitted the message, not that Claude Code acted on it.\n\nOpen the artifact once to initialize the shared store from `words.json`. The page needs write access for this first step and for dragging. It shows a read-only or disconnected state when writes are unavailable.\n\n## Agent commands\n\n```sh\n./agent-move board\n./agent-move place glow --after moon\n./agent-move place glow --at 0.25 0.35\n./agent-move reset\n```\n\n`agent-move` finds the registered artifact by matching this folder to `tv list-artifacts`; no ID is stored in the files. `reset` returns all words to the lower door and clears the thinking state. The page generates stable lower-door positions from the word IDs; they are not stored. The page also clears a failed Dispatch turn or a turn with no agent move after 45 seconds.\n\n## Local checks\n\n```sh\npython3 -m unittest -v test_poetry.py\nnode --test dispatch.test.mjs\nnode --test pile-layout.test.mjs\n```\n\nThe Python suite checks reading order, placement, wrapping, overlap, duplicate pile words, and the atomic `tv resource json update` sent through a fake `tv` executable. The JavaScript suites check stable lower-door positions and inspect the Dispatch POST through a local fetch stub, without contacting a real session.\n", "fridge-poetry/agent-move": "#!/usr/bin/env python3\n\"\"\"Move one fridge magnet through Television's JSON store CLI.\"\"\"\n\nimport argparse\nimport json\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport time\n\nfrom poetry import board_text, place_update, starting_state\n\n\nFOLDER = Path(__file__).resolve().parent\n\n\ndef tv(*arguments: str) -> str:\n    \"\"\"Call the configured tv CLI and turn failures into useful demo errors.\"\"\"\n    result = subprocess.run([\"tv\", *arguments], capture_output=True, text=True, check=False)\n    if result.returncode:\n        raise RuntimeError(result.stderr.strip() or result.stdout.strip() or \"tv command failed\")\n    return result.stdout.strip()\n\n\ndef artifact_id() -> str:\n    \"\"\"Resolve this folder's registered path artifact without embedding an ID.\"\"\"\n    response = json.loads(tv(\"list-artifacts\"))\n    matches = [\n        artifact for artifact in response.get(\"artifacts\", [])\n        if artifact.get(\"kind\") == \"path\" and Path(artifact.get(\"path\", \"\")).resolve() == FOLDER\n    ]\n    if len(matches) == 1:\n        return matches[0][\"id\"]\n    if matches:\n        raise RuntimeError(f\"Several Television artifacts point at {FOLDER}; keep one for this demo.\")\n    raise RuntimeError(\n        f\"No Television path artifact points at {FOLDER}. \"\n        \"Register it with tv create-path-artifact --path <folder> first.\"\n    )\n\n\ndef read_state(identifier: str) -> dict:\n    \"\"\"Read the current store, explaining how to seed one that is still empty.\"\"\"\n    response = json.loads(tv(\"resource\", \"json\", \"get\", \"--artifact\", identifier))\n    if not response.get(\"exists\"):\n        raise RuntimeError(\"The fridge store is empty. Open the page once or run agent-move reset.\")\n    state = response[\"value\"]\n    if not isinstance(state, dict) or not isinstance(state.get(\"words\"), dict):\n        raise RuntimeError(\"The fridge store has an unexpected shape; run agent-move reset.\")\n    return state\n\n\ndef parse_arguments(argv: list[str]) -> argparse.Namespace:\n    \"\"\"Parse commands while treating a leading-hyphen magnet as a word.\"\"\"\n    parser = argparse.ArgumentParser(description=__doc__)\n    commands = parser.add_subparsers(dest=\"command\", required=True)\n    commands.add_parser(\"board\", help=\"Show placed words and the pile\")\n    commands.add_parser(\"reset\", help=\"Return every word to the pile\")\n    place = commands.add_parser(\"place\", help=\"Place one pile word on the fridge\")\n    place.add_argument(\"word\")\n    position = place.add_mutually_exclusive_group(required=True)\n    position.add_argument(\"--after\", metavar=\"ANCHOR\")\n    position.add_argument(\"--at\", nargs=2, type=float, metavar=(\"X\", \"Y\"))\n    # Magnetic poetry includes \"-s\" and \"-ing\". argparse otherwise mistakes\n    # the required first place operand for a command option.\n    suffix_word = (\n        argv[1] if len(argv) > 1 and argv[0] == \"place\"\n        and argv[1].startswith(\"-\") and not argv[1].startswith(\"--\") else None\n    )\n    if suffix_word is not None:\n        argv = [argv[0], \"__magnet_word__\", *argv[2:]]\n    if \"--after\" in argv:\n        anchor_index = argv.index(\"--after\")\n        if anchor_index + 1 < len(argv) and argv[anchor_index + 1].startswith(\"-\") \\\n                and not argv[anchor_index + 1].startswith(\"--\"):\n            argv = [*argv[:anchor_index], f\"--after={argv[anchor_index + 1]}\", *argv[anchor_index + 2:]]\n    arguments = parser.parse_args(argv)\n    if suffix_word is not None:\n        arguments.word = suffix_word\n    return arguments\n\n\ndef main() -> int:\n    \"\"\"Parse a board, place, or reset command and apply its store operation.\"\"\"\n    arguments = parse_arguments(sys.argv[1:])\n\n    try:\n        identifier = artifact_id()\n        if arguments.command == \"reset\":\n            texts = json.loads((FOLDER / \"words.json\").read_text())\n            tv(\"resource\", \"json\", \"set\", \"--artifact\", identifier, json.dumps(starting_state(texts)))\n            print(f\"Reset {len(texts)} magnets to the pile.\")\n        elif arguments.command == \"board\":\n            print(board_text(read_state(identifier)))\n        else:\n            update = place_update(\n                read_state(identifier), arguments.word, after=arguments.after,\n                at=tuple(arguments.at) if arguments.at else None,\n                timestamp=int(time.time() * 1000),\n            )\n            tv(\"resource\", \"json\", \"update\", \"--artifact\", identifier, json.dumps(update))\n            placed = next(value for key, value in update.items() if key.startswith(\"words/\"))\n            print(f'Placed \"{placed[\"text\"]}\" at ({placed[\"x\"]:.3f}, {placed[\"y\"]:.3f}).')\n    except (OSError, ValueError, KeyError, json.JSONDecodeError, RuntimeError) as error:\n        print(f\"agent-move: {error}\", file=sys.stderr)\n        return 1\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "fridge-poetry/app.mjs": "// The page renders one shared board. Pointer drags write Rupert's moves; store\n// changes from the agent animate from the old pile tile to the new fridge tile.\nimport {\n  getStore, onAccessChanged, onConnectionStatusChanged, onValue,\n  ref, remove, runTransaction, update,\n} from \"/sdk/v1/resources.js\";\nimport { buildMessage, submitTurn } from \"./dispatch.mjs\";\nimport { isRoomMagnet, layoutPile, tileWidthFraction } from \"./pile-layout.mjs\";\n\n// Store schema: { words: { <stable magnet id>: word }, thinking: turn|null }.\n// Each word requires text:string. Built-in pile words have only text. The room\n// relay adds fresh-key pile words with from:\"room\" and addedAt:number (Unix ms).\n// A placed word also has x:number and y:number (top-left fridge fractions),\n// placedBy:\"rupert\"|\"agent\", and placedAt:number (Unix ms). Room origin can be\n// recognized by its fresh key if agent-move replaces its other fields.\n// A turn is { wordId:string, since:number }. The page initializes the store,\n// writes Rupert's moves, room-word removals and thinking, and clears failed/\n// timed-out turns. It retains room fields when Rupert moves a word.\n// agent-move writes an agent word and thinking:null in one update, or resets all.\nconst db = getStore();\nconst root = ref(db);\nconst fridge = document.querySelector(\"#fridge\");\nconst pile = document.querySelector(\"#pile\");\nconst pileContent = document.querySelector(\"#pile-content\");\nconst roomBin = document.querySelector(\"#room-bin\");\nconst status = document.querySelector(\"#status\");\nconst error = document.querySelector(\"#error\");\n\nlet state = null;\nlet storeEmpty = false;\nlet initialWords = null;\nlet config = null;\nlet access = null;\nlet connection = \"connecting\";\nlet initializing = false;\nlet thinkingTimer = null;\nconst arriving = new Set();\nconst roomArriving = new Set();\nconst roomHighlights = new Map();\nconst settling = new Map();\n\n/** A magnet is on the fridge only when both fractional coordinates exist. */\nfunction isPlaced(word) {\n  return Number.isFinite(word?.x) && Number.isFinite(word?.y);\n}\n\n/** Read near-aligned magnets as lines, with each line ordered left to right. */\nfunction poemLines(words) {\n  const placed = Object.values(words).filter(isPlaced).sort((a, b) => a.y - b.y || a.x - b.x);\n  const rows = [];\n  for (const word of placed) {\n    if (!rows.length || word.y - rows.at(-1)[0].y > 0.075 * 0.7) rows.push([]);\n    rows.at(-1).push(word);\n  }\n  return rows.map((row) => row.sort((a, b) => a.x - b.x).map((word) => word.text));\n}\n\nfunction canWrite() {\n  return access === \"read-write\" && connection === \"connected\";\n}\n\nfunction canDrag(word) {\n  return canWrite() && (isPlaced(word) || (config && !state?.thinking && !arriving.size));\n}\n\nfunction showError(message) {\n  error.textContent = message;\n  error.hidden = !message;\n}\n\nfunction reportStoreError(failure) {\n  const message = failure?.code === \"disconnected\"\n    ? \"Connection lost. A recent move may still have saved.\"\n    : failure?.code === \"read-only\"\n      ? \"This view can only read the fridge.\"\n      : `Couldn't save the fridge: ${failure.message || failure}`;\n  showError(message);\n}\n\nfunction renderStatus() {\n  status.classList.toggle(\"thinking\", Boolean(state?.thinking || arriving.size));\n  if (connection === \"disconnected\") {\n    status.textContent = \"offline \u00b7 moves paused\";\n  } else if (access === \"read\" || access === null && connection === \"connected\") {\n    status.textContent = \"view only\";\n  } else if (storeEmpty || !state) {\n    status.textContent = \"setting out words\u2026\";\n  } else if (state.thinking || arriving.size) {\n    status.textContent = \"agent is thinking\u2026\";\n  } else if (!config) {\n    status.textContent = \"waiting for agent\u2026\";\n  } else {\n    status.textContent = \"your move\";\n  }\n}\n\n/** Rebuild both surfaces from the store; no local coordinates are authoritative. */\nfunction render() {\n  fridge.querySelectorAll(\".magnet\").forEach((tile) => tile.remove());\n  pileContent.replaceChildren();\n  if (!state) {\n    renderStatus();\n    return;\n  }\n  const { slots: pileSlots, scale, contentHeight } = layoutPile(state.words);\n  pile.style.setProperty(\"--pile-scale\", scale);\n  pileContent.style.height = `${contentHeight * 100}%`;\n  for (const [wordId, word] of Object.entries(state.words)) {\n    if (typeof word?.text !== \"string\") continue;\n    const tile = document.createElement(\"span\");\n    tile.className = \"magnet\";\n    if (isRoomMagnet(wordId, word)) tile.classList.add(\"room-magnet\");\n    if (roomHighlights.has(wordId)) tile.classList.add(\"room-highlight\");\n    tile.dataset.id = wordId;\n    tile.textContent = word.text;\n    const number = Number(wordId.replace(/\\D/g, \"\")) || 1;\n    tile.style.setProperty(\"--tilt\", `${((number * 7) % 13 - 6) * 0.55}deg`);\n    // This width is the same fraction used by agent-move to avoid overlaps.\n    tile.style.setProperty(\"--tile-width\", `${tileWidthFraction(word.text) * (isPlaced(word) ? 1 : scale) * 100}%`);\n    if (settling.has(wordId)) tile.classList.add(\"settle\");\n    if (isPlaced(word)) {\n      tile.style.left = `${word.x * 100}%`;\n      tile.style.top = `${word.y * 100}%`;\n      if (arriving.has(wordId)) tile.classList.add(\"arrival-pending\");\n      fridge.append(tile);\n    } else {\n      const slot = pileSlots.get(wordId);\n      tile.style.left = `${slot.x * 100}%`;\n      tile.style.top = `${slot.y * 100}%`;\n      if (roomArriving.has(wordId)) tile.classList.add(\"arrival-pending\");\n      pileContent.append(tile);\n    }\n    if (canDrag(word) && !arriving.has(wordId) && !roomArriving.has(wordId)) tile.classList.add(\"can-move\");\n    tile.addEventListener(\"pointerdown\", startDrag);\n  }\n  renderStatus();\n}\n\n/** A newly stuck tile makes one short physical wobble, including after a redraw. */\nfunction markSettling(wordId) {\n  if (settling.has(wordId)) clearTimeout(settling.get(wordId));\n  const tile = [...fridge.querySelectorAll(\".magnet\"), ...pile.querySelectorAll(\".magnet\")]\n    .find((candidate) => candidate.dataset.id === wordId);\n  tile?.classList.remove(\"settle\");\n  if (tile) void tile.offsetWidth;\n  tile?.classList.add(\"settle\");\n  settling.set(wordId, setTimeout(() => {\n    settling.delete(wordId);\n    tile?.classList.remove(\"settle\");\n    [...fridge.querySelectorAll(\".magnet\"), ...pile.querySelectorAll(\".magnet\")]\n      .find((candidate) => candidate.dataset.id === wordId)?.classList.remove(\"settle\");\n  }, 360));\n}\n\n/** Let magnets slide into new slots when a room arrival or removal reflows the pile. */\nfunction animatePileReflow(previousRects) {\n  if (window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches) return;\n  for (const tile of pileContent.querySelectorAll(\".magnet\")) {\n    const previous = previousRects.get(tile.dataset.id);\n    if (!previous || roomArriving.has(tile.dataset.id)) continue;\n    const current = tile.getBoundingClientRect();\n    const deltaX = previous.left - current.left;\n    const deltaY = previous.top - current.top;\n    if (Math.abs(deltaX) < 1 && Math.abs(deltaY) < 1\n      && Math.abs(previous.width - current.width) < 1) continue;\n    tile.animate([\n      { transform: `translate3d(${deltaX}px, ${deltaY}px, 0) rotate(var(--tilt)) scale(${previous.width / current.width}, ${previous.height / current.height})` },\n      { transform: \"translate3d(0, 0, 0) rotate(var(--tilt)) scale(1)\" },\n    ], { duration: 340, easing: \"cubic-bezier(.2,.78,.25,1)\" });\n  }\n}\n\n/** Keep a newly arrived or returned magnet in view once the pile needs scroll. */\nfunction revealPileWord(wordId) {\n  const tile = [...pileContent.querySelectorAll(\".magnet\")]\n    .find((candidate) => candidate.dataset.id === wordId);\n  if (!tile) return false;\n  const top = tile.offsetTop;\n  if (top >= pile.scrollTop + 10\n    && top + tile.offsetHeight <= pile.scrollTop + pile.clientHeight - 10) return false;\n  pile.scrollTop = Math.max(0, top - pile.clientHeight * 0.55);\n  return true;\n}\n\n/** A room word falls from beyond the top edge, bounces, then glows for a while. */\nasync function animateRoomArrival(wordId) {\n  const target = [...pileContent.querySelectorAll(\".magnet\")]\n    .find((tile) => tile.dataset.id === wordId);\n  if (!target) {\n    roomArriving.delete(wordId);\n    return;\n  }\n  const targetRect = target.getBoundingClientRect();\n  const doorRect = document.querySelector(\".fridge\").getBoundingClientRect();\n  const sourceStyle = getComputedStyle(target);\n  const flyer = target.cloneNode(true);\n  flyer.classList.remove(\"arrival-pending\", \"can-move\");\n  flyer.classList.add(\"room-flyer\");\n  Object.assign(flyer.style, {\n    left: `${targetRect.left}px`, top: `${targetRect.top}px`,\n    width: `${targetRect.width}px`, height: `${targetRect.height}px`,\n    fontSize: sourceStyle.fontSize, padding: sourceStyle.padding,\n  });\n  document.body.append(flyer);\n  const startY = -Math.max(targetRect.top - doorRect.top + 80, 150);\n  const duration = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? 0 : 920;\n  try {\n    await flyer.animate([\n      { transform: `translate3d(0, ${startY}px, 0) rotate(-11deg) scale(1.12)`, opacity: 0, offset: 0 },\n      { transform: \"translate3d(0, 12px, 0) rotate(calc(var(--tilt) + 3deg)) scale(.96)\", opacity: 1, offset: .72 },\n      { transform: \"translate3d(0, -7px, 0) rotate(calc(var(--tilt) - 1deg)) scale(1.02)\", opacity: 1, offset: .85 },\n      { transform: \"translate3d(0, 0, 0) rotate(var(--tilt)) scale(1)\", opacity: 1, offset: 1 },\n    ], { duration, easing: \"cubic-bezier(.28,.58,.27,1)\", fill: \"forwards\" }).finished;\n  } catch {\n    // A later render or navigation can cancel the effect.\n  } finally {\n    flyer.remove();\n    roomArriving.delete(wordId);\n    const liveTile = [...pileContent.querySelectorAll(\".magnet\")]\n      .find((tile) => tile.dataset.id === wordId);\n    liveTile?.classList.remove(\"arrival-pending\");\n    if (state?.words[wordId]) {\n      if (canDrag(state.words[wordId]) && !arriving.has(wordId)) {\n        liveTile?.classList.add(\"can-move\");\n      }\n      markSettling(wordId);\n      if (roomHighlights.has(wordId)) clearTimeout(roomHighlights.get(wordId));\n      liveTile?.classList.add(\"room-highlight\");\n      roomHighlights.set(wordId, setTimeout(() => {\n        roomHighlights.delete(wordId);\n        [...document.querySelectorAll(\".magnet\")]\n          .find((tile) => tile.dataset.id === wordId)?.classList.remove(\"room-highlight\");\n      }, 4000));\n    }\n  }\n}\n\n/** Show the magnet and an agent cursor travelling from pile to destination. */\nasync function animateArrival(wordId, sourceRect) {\n  const target = [...fridge.querySelectorAll(\".magnet\")].find((tile) => tile.dataset.id === wordId);\n  if (!sourceRect || !target) {\n    arriving.delete(wordId);\n    target?.classList.remove(\"arrival-pending\");\n    if (state?.words[wordId] && canDrag(state.words[wordId])) target?.classList.add(\"can-move\");\n    renderStatus();\n    return;\n  }\n  const targetRect = target.getBoundingClientRect();\n  const flyer = target.cloneNode(true);\n  flyer.classList.remove(\"arrival-pending\", \"can-move\");\n  flyer.classList.add(\"agent-flyer\");\n  Object.assign(flyer.style, {\n    left: `${sourceRect.left}px`, top: `${sourceRect.top}px`,\n    width: `${sourceRect.width}px`, height: `${sourceRect.height}px`,\n    transformOrigin: \"top left\",\n  });\n  const cursor = document.createElement(\"div\");\n  cursor.className = \"agent-cursor\";\n  const label = document.createElement(\"span\");\n  label.textContent = \"agent\";\n  cursor.append(label);\n  cursor.style.left = `${sourceRect.left + sourceRect.width - 6}px`;\n  cursor.style.top = `${sourceRect.top + sourceRect.height - 5}px`;\n  document.body.append(flyer, cursor);\n\n  const deltaX = targetRect.left - sourceRect.left;\n  const deltaY = targetRect.top - sourceRect.top;\n  const middleX = deltaX * 0.48;\n  const middleY = deltaY * 0.48 - 26;\n  const flyerFlight = [\n    { transform: \"translate3d(0, 0, 0) rotate(var(--tilt)) scale(1)\", offset: 0 },\n    { transform: `translate3d(${middleX}px, ${middleY}px, 0) rotate(var(--tilt)) scale(1.1)`, offset: 0.48 },\n    { transform: `translate3d(${deltaX}px, ${deltaY}px, 0) rotate(var(--tilt)) scale(${targetRect.width / sourceRect.width}, ${targetRect.height / sourceRect.height})`, offset: 1 },\n  ];\n  const cursorFlight = [\n    { transform: \"translate3d(0, 0, 0)\", offset: 0 },\n    { transform: `translate3d(${middleX}px, ${middleY}px, 0)`, offset: 0.48 },\n    { transform: `translate3d(${deltaX}px, ${deltaY}px, 0)`, offset: 1 },\n  ];\n  const duration = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches ? 0 : 1200;\n  const timing = { duration, easing: \"cubic-bezier(.22,.8,.25,1)\", fill: \"forwards\" };\n  try {\n    await Promise.all([\n      flyer.animate(flyerFlight, timing).finished,\n      cursor.animate(cursorFlight, timing).finished,\n    ]);\n  } catch {\n    // Animation promises reject when a browser cancels an effect during reload.\n  } finally {\n    flyer.remove();\n    cursor.remove();\n    arriving.delete(wordId);\n    const landed = [...fridge.querySelectorAll(\".magnet\")]\n      .find((tile) => tile.dataset.id === wordId);\n    landed?.classList.remove(\"arrival-pending\");\n    if (state?.words[wordId] && canDrag(state.words[wordId])) landed?.classList.add(\"can-move\");\n    markSettling(wordId);\n    renderStatus();\n  }\n}\n\n/** Clear only the turn we observed, so a late error cannot erase a newer turn. */\nasync function clearThinking(turn) {\n  try {\n    await runTransaction(ref(db, \"thinking\"), (current) =>\n      current?.wordId === turn.wordId && current?.since === turn.since ? null : undefined);\n  } catch (failure) {\n    reportStoreError(failure);\n  }\n}\n\nfunction scheduleTimeout() {\n  if (thinkingTimer) clearTimeout(thinkingTimer);\n  thinkingTimer = null;\n  if (!state?.thinking || !canWrite()) return;\n  const turn = state.thinking;\n  const delay = Math.max(0, turn.since + 45_000 - Date.now());\n  thinkingTimer = setTimeout(() => clearThinking(turn), delay);\n}\n\nfunction startDrag(event) {\n  if (event.pointerType === \"mouse\" && event.button !== 0) return;\n  const tile = event.currentTarget;\n  const wordId = tile.dataset.id;\n  const word = state?.words[wordId];\n  if (!word || !canDrag(word) || arriving.has(wordId) || roomArriving.has(wordId)) return;\n  event.preventDefault();\n  const isRoom = isRoomMagnet(wordId, word);\n  fridge.parentElement.classList.toggle(\"room-dragging\", isRoom);\n\n  const sourceRect = tile.getBoundingClientRect();\n  const startX = event.clientX;\n  const startY = event.clientY;\n  const ghost = tile.cloneNode(true);\n  ghost.classList.remove(\"can-move\", \"settle\");\n  ghost.classList.add(\"drag-ghost\");\n  Object.assign(ghost.style, {\n    left: `${sourceRect.left}px`, top: `${sourceRect.top}px`,\n    width: `${sourceRect.width}px`, height: `${sourceRect.height}px`,\n    transform: \"translate3d(0, 0, 0) rotate(var(--tilt))\",\n  });\n  document.body.append(ghost);\n  tile.classList.add(\"is-source\");\n\n  let frame = 0;\n  let deltaX = 0;\n  let deltaY = 0;\n  function move(pointer) {\n    if (pointer.pointerId !== event.pointerId) return;\n    if (isRoom) roomBin.classList.toggle(\"active\", containsPointer(roomBin, pointer));\n    deltaX = pointer.clientX - startX;\n    deltaY = pointer.clientY - startY;\n    if (frame) return;\n    frame = requestAnimationFrame(() => {\n      ghost.style.transform = `translate3d(${deltaX}px, ${deltaY}px, 0) rotate(var(--tilt))`;\n      frame = 0;\n    });\n  }\n  function finish(pointer) {\n    if (pointer && pointer.pointerId !== event.pointerId) return;\n    window.removeEventListener(\"pointermove\", move);\n    window.removeEventListener(\"pointerup\", finish);\n    window.removeEventListener(\"pointercancel\", cancel);\n    window.removeEventListener(\"blur\", cancel);\n    if (frame) cancelAnimationFrame(frame);\n    fridge.parentElement.classList.remove(\"room-dragging\");\n    roomBin.classList.remove(\"active\");\n    tile.classList.remove(\"is-source\");\n    ghost.remove();\n    if (pointer) void saveDrop(wordId, word, pointer, sourceRect, startX, startY);\n  }\n  function cancel(pointer) {\n    if (pointer?.pointerId !== undefined && pointer.pointerId !== event.pointerId) return;\n    finish(null);\n  }\n  1 }), true);\n  assert.equal(isRoomMagnet(\"room-new\", { text: \"moon\", placedBy: \"agent\" }), true);\n});\n\ntest(\"all 66 pile magnets fit on the lower door without losing their spots\", () => {\n  const { slots: positions, scale, contentHeight } = layoutPile(words);\n  assert.equal(positions.size, texts.length);\n  assert.equal(scale, 1);\n  assert.equal(contentHeight, 1);\n  assert.ok(Math.max(...[...positions.values()].map(({ row }) => row)) < 9);\n  for (const [wordId, position] of positions) {\n    assert.ok(position.x >= 0 && position.x + tileWidthFraction(words[wordId].text) <= 0.98);\n    assert.ok(position.y >= 0 && position.y < 0.87);\n  }\n\n  const placed = { ...words, m001: { ...words.m001, x: 0.1, y: 0.2 } };\n  assert.deepEqual(layoutPile(placed).slots, positions);\n});\n\ntest(\"neighbors have room to be picked up despite small scattering offsets\", () => {\n  const positions = layoutPile(words).slots;\n  const rows = new Map();\n  for (const [wordId, position] of positions) {\n    if (!rows.has(position.row)) rows.set(position.row, []);\n    rows.get(position.row).push([wordId, position]);\n  }\n  for (const row of rows.values()) {\n    for (let index = 1; index < row.length; index += 1) {\n      const [previousId, previous] = row[index - 1];\n      const [, current] = row[index];\n      assert.ok(current.x >= previous.x + tileWidthFraction(words[previousId].text) - 0.015);\n    }\n  }\n});\n\ntest(\"room words occupy separate non-overlapping slots and extra rows scroll inside the door\", () => {\n  const roomWords = Object.fromEntries(Array.from({ length: 90 }, (_, index) => [\n    `room-${String(index).padStart(3, \"0\")}`,\n    { text: `voice${index}`, from: \"room\", addedAt: 1_000 + index },\n  ]));\n  const { slots, scale, contentHeight } = layoutPile({ ...words, ...roomWords });\n  assert.equal(slots.size, 156);\n  assert.ok(scale < 1 && scale >= 0.68);\n  assert.ok(contentHeight > 1);\n  for (const [wordId, position] of slots) {\n    assert.ok(position.x >= 0 && position.x + tileWidthFraction((roomWords[wordId] || words[wordId]).text) * scale <= 0.98);\n    assert.ok(position.y >= 0 && position.y < 0.87);\n  }\n  const rows = new Map();\n  for (const [wordId, position] of slots) {\n    if (!rows.has(position.row)) rows.set(position.row, []);\n    rows.get(position.row).push([wordId, position]);\n  }\n  for (const row of rows.values()) {\n    for (let index = 1; index < row.length; index += 1) {\n      const [previousId, previous] = row[index - 1];\n      const [, current] = row[index];\n      const text = (roomWords[previousId] || words[previousId]).text;\n      assert.ok(current.x >= previous.x + tileWidthFraction(text) * scale - 0.015);\n    }\n  }\n});\n", "fridge-poetry/poetry.py": "\"\"\"Pure fridge state and placement rules shared by the agent CLI and its tests.\n\nPositions are top-left fractions of the fridge. Width matches the page tile\nformula; height is a conservative estimate so the CLI needs no browser layout.\n\"\"\"\n\nfrom __future__ import annotations\n\n\nTILE_HEIGHT = 0.075\nEDGE = 0.04\nLINE_STEP = 0.11\nGAP = 0.012\n\n\ndef starting_state(texts: list[str]) -> dict:\n    \"\"\"Return a new board with stable IDs and every word in the pile.\"\"\"\n    return {\n        \"words\": {f\"m{number:03d}\": {\"text\": text} for number, text in enumerate(texts, 1)},\n        \"thinking\": None,\n    }\n\n\ndef is_on_fridge(word: dict) -> bool:\n    \"\"\"Identify placed words by their fractional coordinates.\"\"\"\n    return isinstance(word.get(\"x\"), (int, float)) and isinstance(word.get(\"y\"), (int, float))\n\n\ndef tile_width(text: str) -> float:\n    \"\"\"Match the width fraction assigned to each tile by app.mjs.\"\"\"\n    return min(0.25, 0.032 + len(text) * 0.014)\n\n\ndef overlaps(first: dict, second: dict) -> bool:\n    \"\"\"Check the visible rectangles, allowing a small breathing gap.\"\"\"\n    return (\n        first[\"x\"] < second[\"x\"] + tile_width(second[\"text\"]) + GAP\n        and first[\"x\"] + tile_width(first[\"text\"]) + GAP > second[\"x\"]\n        and first[\"y\"] < second[\"y\"] + TILE_HEIGHT + GAP\n        and first[\"y\"] + TILE_HEIGHT + GAP > second[\"y\"]\n    )\n\n\ndef poem_rows(state: dict) -> list[list[tuple[str, dict]]]:\n    \"\"\"Group nearly aligned words into lines, then read each line left to right.\"\"\"\n    placed = [(word_id, word) for word_id, word in state[\"words\"].items() if is_on_fridge(word)]\n    placed.sort(key=lambda pair: (pair[1][\"y\"], pair[1][\"x\"]))\n    rows: list[list[tuple[str, dict]]] = []\n    for pair in placed:\n        if not rows or pair[1][\"y\"] - rows[-1][0][1][\"y\"] > TILE_HEIGHT * 0.7:\n            rows.append([])\n        rows[-1].append(pair)\n    for row in rows:\n        row.sort(key=lambda pair: pair[1][\"x\"])\n    return rows\n\n\ndef poem_lines(state: dict) -> list[list[str]]:\n    \"\"\"Return the fridge poem as word lines for the Dispatch prompt.\"\"\"\n    return [[word[\"text\"] for _, word in row] for row in poem_rows(state)]\n\n\ndef board_text(state: dict) -> str:\n    \"\"\"Print placed words and coordinates in reading order, then the remaining pile.\"\"\"\n    rows = poem_rows(state)\n    fridge = \"\\n\".join(\n        \"  \" + \"  \".join(f'{word[\"text\"]} ({word[\"x\"]:.3f}, {word[\"y\"]:.3f})' for _, word in row)\n        for row in rows\n    ) or \"  (empty)\"\n    pile = \", \".join(word[\"text\"] for word in state[\"words\"].values() if not is_on_fridge(word))\n    return f\"Fridge:\\n{fridge}\\nPile: {pile or '(empty)'}\"\n\n\ndef find_open_spot(state: dict, text: str, preferred_x: float, preferred_y: float) -> tuple[float, float]:\n    \"\"\"Try the intended line, nudging right; wrap to the next line as needed.\"\"\"\n    placed = [word for word in state[\"words\"].values() if is_on_fridge(word)]\n    y = preferred_y\n    first_line = True\n    while y + TILE_HEIGHT <= 1 - EDGE:\n        x = preferred_x if first_line else EDGE\n        first_line = False\n        while x + tile_width(text) <= 1 - EDGE:\n            candidate = {\"text\": text, \"x\": x, \"y\": y}\n            collisions = [word for word in placed if overlaps(candidate, word)]\n            if not collisions:\n                return round(x, 4), round(y, 4)\n            x = max(word[\"x\"] + tile_width(word[\"text\"]) + GAP for word in collisions)\n        y = round(y + LINE_STEP, 4)\n    raise ValueError(\"No room left on the fridge for another word\")\n\n\ndef place_update(\n    state: dict, text: str, *, after: str | None = None,\n    at: tuple[float, float] | None = None, timestamp: int,\n) -> dict:\n    \"\"\"Return one atomic tv update: a pile copy's placement and a cleared thinking flag.\"\"\"\n    if (after is None) == (at is None):\n        raise ValueError(\"Choose exactly one of --after or --at\")\n    if at is not None and not all(0 <= coordinate <= 1 for coordinate in at):\n        raise ValueError(\"Coordinates must be between 0 and 1\")\n    pile_word = next(\n        ((word_id, word) for word_id, word in state[\"words\"].items()\n         if word[\"text\"].casefold() == text.casefold() and not is_on_fridge(word)),\n        None,\n    )\n    if pile_word is None:\n        raise ValueError(f'No pile copy of \"{text}\" is available')\n    if after is not None:\n        anchor = next(\n            (word for word in state[\"words\"].values()\n             if word[\"text\"].casefold() == after.casefold() and is_on_fridge(word)),\n            None,\n        )\n        if anchor is None:\n            raise ValueError(f'No \"{after}\" is on the fridge')\n        preferred_x = anchor[\"x\"] + tile_width(anchor[\"text\"]) + GAP\n        preferred_y = anchor[\"y\"]\n    else:\n        assert at is not None\n        preferred_x, preferred_y = at\n    x, y = find_open_spot(state, pile_word[1][\"text\"], preferred_x, preferred_y)\n    return {\n        f\"words/{pile_word[0]}\": {\n            \"text\": pile_word[1][\"text\"], \"x\": x, \"y\": y,\n            \"placedBy\": \"agent\", \"placedAt\": timestamp,\n        },\n        \"thinking\": None,\n    }\n", "fridge-poetry/style.css": "/* One enamel door. Television supplies its paint and light; paper magnets keep their own ink. */\n* { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  min-height: 100vh;\n  color: var(--color-text, #242322);\n  background: var(--color-surface-muted, #e7e9e5);\n  font-family: var(--font-sans, system-ui, sans-serif);\n}\n\n.experience {\n  display: grid;\n  place-items: center;\n  min-height: 100vh;\n  padding: clamp(10px, 1.4vw, 22px);\n  perspective: 1800px;\n}\n\n/* The body, bevel and sheen are separate light passes on the same painted metal. */\n.fridge {\n  position: relative;\n  isolation: isolate;\n  width: min(100%, 1500px);\n  height: clamp(760px, calc(100vh - 30px), 1080px);\n  overflow: hidden;\n  border: 1px solid var(--panel-border-color, #879390);\n  border-radius: 39px 34px 42px 38px;\n  color: var(--panel-text-color, #24312e);\n  background-color: var(--panel-background, #e5eae5);\n  background-image:\n    linear-gradient(90deg,\n      color-mix(in srgb, var(--neutral-50, #fff) 25%, transparent),\n      transparent 8%, transparent 92%,\n      color-mix(in srgb, var(--neutral-900, #222) 29%, transparent)),\n    linear-gradient(125deg,\n      color-mix(in oklch, var(--panel-background, #e5eae5) 72%, var(--neutral-50, #fff)) 0%,\n      color-mix(in oklch, var(--panel-background, #e5eae5) 52%, var(--accent-500, #739668)) 35%,\n      color-mix(in oklch, var(--panel-background, #e5eae5) 60%, var(--accent-500, #739668)) 68%,\n      color-mix(in oklch, var(--panel-background, #e5eae5) 65%, var(--neutral-700, #464646)) 100%);\n  box-shadow:\n    var(--shadow-lg, 0 14px 32px rgb(0 0 0 / .2)),\n    20px 26px 42px color-mix(in srgb, var(--neutral-900, #222) 27%, transparent),\n    inset 4px 3px 5px color-mix(in srgb, var(--neutral-50, #fff) 38%, transparent),\n    inset -12px 0 20px color-mix(in srgb, var(--neutral-900, #222) 13%, transparent);\n  transform: rotateY(-1.4deg) rotateX(.45deg);\n  transform-style: preserve-3d;\n}\n\n.fridge::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: 1;\n  border-radius: inherit;\n  pointer-events: none;\n  background:\n    linear-gradient(106deg, transparent 9%,\n      color-mix(in srgb, var(--neutral-50, #fff) 17%, transparent) 24%,\n      transparent 42%),\n    repeating-linear-gradient(0deg,\n      color-mix(in srgb, var(--accent-500, #739668) 2%, transparent) 0 1px,\n      transparent 1px 5px);\n}\n\n.fridge::after {\n  content: \"\";\n  position: absolute;\n  z-index: 2;\n  top: 2%;\n  right: 0;\n  bottom: 2%;\n  width: 2.4%;\n  border-radius: 0 30px 34px 0;\n  pointer-events: none;\n  background: linear-gradient(90deg, transparent,\n    color-mix(in srgb, var(--neutral-900, #222) 17%, transparent));\n}\n\n/* Both drop zones are invisible regions of one uninterrupted door. */\n.fridge-surface,\n.pile {\n  position: absolute;\n  left: 5%;\n  right: 15%;\n  z-index: 3;\n  container-type: inline-size;\n}\n\n.fridge-surface { top: 6%; height: 49%; }\n.pile {\n  top: 57%;\n  bottom: 2%;\n  overflow-x: hidden;\n  overflow-y: auto;\n  scrollbar-width: none;\n}\n.pile::-webkit-scrollbar { display: none; }\n.pile-content { position: relative; width: 100%; min-height: 100%; }\n\n.handle {\n  position: absolute;\n  z-index: 5;\n  top: 31%;\n  right: 5%;\n  width: clamp(28px, 3vw, 46px);\n  height: 31%;\n  border: 1px solid var(--panel-border-color, #879390);\n  border-radius: 24px;\n  pointer-events: none;\n  background: linear-gradient(90deg,\n    color-mix(in oklch, var(--panel-background, #e5eae5) 38%, var(--neutral-900, #222)),\n    color-mix(in oklch, var(--panel-background, #e5eae5) 34%, var(--neutral-50, #fff)) 29%,\n    color-mix(in oklch, var(--panel-background, #e5eae5) 45%, var(--neutral-100, #f4f4f4)) 57%,\n    color-mix(in oklch, var(--panel-background, #e5eae5) 40%, var(--neutral-800, #383838)));\n  box-shadow:\n    var(--shadow-md, 0 5px 13px rgb(0 0 0 / .23)),\n    inset 2px 0 2px color-mix(in srgb, var(--neutral-50, #fff) 45%, transparent),\n    inset -3px 0 4px color-mix(in srgb, var(--neutral-900, #222) 25%, transparent);\n  transform: translateZ(25px) rotateY(-9deg);\n}\n\n.handle::before,\n.handle::after {\n  content: \"\";\n  position: absolute;\n  left: 18%;\n  right: 18%;\n  height: 6%;\n  border-radius: 8px;\n  background: color-mix(in oklch, var(--panel-background, #e5eae5) 42%, var(--neutral-700, #464646));\n  box-shadow: inset 0 1px 2px color-mix(in srgb, var(--neutral-900, #222) 25%, transparent);\n}\n.handle::before { top: 6%; }\n.handle::after { bottom: 6%; }\n\n/* The little bin appears only while Rupert is carrying a room word. */\n.room-bin {\n  position: absolute;\n  z-index: 8;\n  right: 4%;\n  bottom: 4%;\n  display: grid;\n  place-items: center;\n  width: 74px;\n  height: 69px;\n  border: 2px solid var(--panel-border-color, #879390);\n  border-radius: 7px;\n  color: var(--color-text, #242322);\n  background: color-mix(in oklch, var(--panel-background, #e5eae5) 70%, var(--neutral-50, #fff));\n  box-shadow: var(--shadow-md, 0 5px 13px rgb(0 0 0 / .23));\n  opacity: 0;\n  pointer-events: none;\n  transform: translateY(12px) rotate(6deg);\n  transition: opacity 150ms ease, transform 150ms ease;\n}\n.room-bin span { font: 700 37px/.8 var(--font-sans, system-ui, sans-serif); }\n.room-bin small { font: 700 11px/1 var(--font-sans, system-ui, sans-serif); }\n.fridge.room-dragging .room-bin { opacity: 1; transform: translateY(0) rotate(6deg); }\n.room-bin.active {\n  outline: var(--outline-focus, 2px solid #4a67b9);\n  outline-offset: 4px;\n  scale: 1.08;\n}\n\n/* A small note and pin carry state without turning the door into a dashboard. */\n.door-notes {\n  position: absolute;\n  z-index: 7;\n  top: 5%;\n  right: 2%;\n  width: clamp(115px, 12%, 185px);\n  pointer-events: none;\n}\n\n#status {\n  position: relative;\n  margin: 0;\n  padding: 18px 9px 10px;\n  border: 1px solid color-mix(in oklch, var(--neutral-50, #fff) 70%, var(--accent-500, #739668));\n  border-radius: 3px;\n  color: var(--neutral-900, #242424);\n  background: color-mix(in oklch, var(--neutral-50, #fff) 83%, var(--accent-100, #e7efdf));\n  box-shadow: var(--shadow-md, 0 5px 13px rgb(0 0 0 / .23));\n  font: 650 clamp(13px, 1.1vw, 17px)/1.2 var(--font-sans, system-ui, sans-serif);\n  text-align: center;\n  transform: rotate(4deg) translateZ(14px);\n}\n\n#status::before {\n  content: \"\";\n  position: absolute;\n  top: -8px;\n  left: calc(50% - 8px);\n  width: 16px;\n  height: 16px;\n  border: 2px solid color-mix(in oklch, var(--color-primary, #63845d) 65%, var(--neutral-900, #222));\n  border-radius: 50%;\n  background: var(--color-primary, #63845d);\n  box-shadow: var(--shadow-sm, 0 2px 5px rgb(0 0 0 / .22));\n}\n\n#status.thinking {\n  box-shadow:\n    var(--shadow-md, 0 5px 13px rgb(0 0 0 / .23)),\n    0 0 0 5px var(--accent-alpha-15, rgb(99 132 93 / .15));\n}\n#status.thinking::before { animation: pin-pulse 1.1s ease-in-out infinite; }\n@keyframes pin-pulse { 50% { scale: 1.22; opacity: .72; } }\n\n.error {\n  margin: 18px 0 0;\n  padding: 9px 10px;\n  border-left: 4px solid var(--color-danger, #a33232);\n  border-radius: 2px;\n  color: var(--color-danger, #a33232);\n  background: #fffefa;\n  box-shadow: var(--shadow-sm, 0 2px 5px rgb(0 0 0 / .2));\n  font: 600 13px/1.25 var(--font-sans, system-ui, sans-serif);\n  overflow-wrap: anywhere;\n  transform: rotate(-3deg);\n}\n[hidden] { display: none !important; }\n\n/* The lower edge and contact shadow give the white paper a magnetic thickness. */\n.magnet {\n  position: absolute;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: var(--tile-width);\n  min-height: 38px;\n  padding: 4px 10px 5px;\n  border: 1px solid #e4e1d8;\n  border-right: 2px solid #d1cdc3;\n  border-bottom: 3px solid #bdb9ae;\n  border-radius: 2px;\n  color: #1b1b1a;\n  background: linear-gradient(155deg, #fff 0%, #fffefa 67%, #f0eee7 100%);\n  box-shadow:\n    0 2px 0 rgb(30 30 29 / .22),\n    var(--shadow-md, 1px 5px 9px rgb(20 24 24 / .28));\n  font: 650 clamp(17px, 2.65cqw, 32px)/1.08 var(--font-sans, system-ui, sans-serif);\n  letter-spacing: -.015em;\n  white-space: nowrap;\n  user-select: none;\n  touch-action: none;\n  cursor: grab;\n  transform: rotate(var(--tilt, 0deg));\n  transform-origin: center;\n}\n\n.pile .magnet {\n  min-height: calc(34px * var(--pile-scale, 1));\n  padding: calc(3px * var(--pile-scale, 1)) calc(9px * var(--pile-scale, 1)) calc(4px * var(--pile-scale, 1));\n  font-size: clamp(11px, calc(2.15cqw * var(--pile-scale, 1)), 26px);\n}\n\n/* The room's paper has the same physical edge, with a tiny coloured star. */\n.room-magnet {\n  border-color: var(--accent-300, #adc99b);\n  border-right-color: var(--accent-400, #93b47c);\n  border-bottom-color: var(--accent-500, #739668);\n  background: linear-gradient(155deg,\n    color-mix(in oklch, var(--accent-50, #f2f8eb) 80%, var(--neutral-50, #fff)),\n    color-mix(in oklch, var(--accent-100, #e7efdf) 68%, var(--neutral-50, #fff)));\n}\n.room-magnet::after {\n  content: \"\u2726\";\n  position: absolute;\n  top: -9px;\n  right: -7px;\n  display: grid;\n  place-items: center;\n  width: 17px;\n  height: 17px;\n  border-radius: 50%;\n  color: var(--color-primary-text, #fff);\n  background: var(--color-primary, #63845d);\n  box-shadow: var(--shadow-sm, 0 2px 5px rgb(0 0 0 / .22));\n  font: 700 12px/1 var(--font-sans, system-ui, sans-serif);\n}\n.magnet.room-highlight {\n  box-shadow:\n    0 2px 0 rgb(30 30 29 / .22),\n    var(--shadow-md, 1px 5px 9px rgb(20 24 24 / .28)),\n    0 0 0 7px var(--accent-alpha-25, rgb(99 132 93 / .25));\n}\n\n.magnet.can-move:hover {\n  z-index: 25;\n  scale: 1.025;\n  box-shadow:\n    0 3px 0 rgb(30 30 29 / .18),\n    var(--shadow-lg, 2px 9px 17px rgb(20 24 24 / .3));\n}\n.magnet:not(.can-move) { cursor: default; }\n.magnet.is-source { opacity: .22; }\n.magnet.arrival-pending { opacity: 0; }\n.magnet:focus-visible { outline: var(--outline-focus, 2px solid #4a67b9); outline-offset: 5px; }\n.magnet.settle { animation: stick-settle 280ms cubic-bezier(.2,.8,.24,1) both; }\n\n@keyframes stick-settle {\n  0% { transform: translateY(-5px) rotate(calc(var(--tilt) - 1.3deg)) scale(1.06); }\n  56% { transform: translateY(2px) rotate(calc(var(--tilt) + .7deg)) scale(.985); }\n  100% { transform: translateY(0) rotate(var(--tilt)) scale(1); }\n}\n\n.drag-ghost,\n.agent-flyer,\n.room-flyer {\n  position: fixed !important;\n  z-index: 1000;\n  margin: 0;\n  min-height: 0;\n  pointer-events: none;\n  will-change: transform;\n  box-shadow:\n    0 4px 0 rgb(30 30 29 / .13),\n    var(--shadow-xl, 4px 17px 26px rgb(20 24 24 / .33));\n}\n.drag-ghost { animation: magnet-lift 150ms ease-out both; cursor: grabbing; }\n.room-flyer { z-index: 1002; }\n@keyframes magnet-lift { from { scale: 1; } to { scale: 1.08; } }\n\n/* The agent carries a colored pointer with a tiny name tag. */\n.agent-cursor {\n  position: fixed;\n  z-index: 1001;\n  width: 60px;\n  height: 65px;\n  pointer-events: none;\n  will-change: transform;\n}\n.agent-cursor::before {\n  content: \"\";\n  position: absolute;\n  top: 0;\n  left: 0;\n  width: 34px;\n  height: 44px;\n  background: var(--color-primary, #63845d);\n  clip-path: polygon(0 0, 0 100%, 27% 75%, 47% 100%, 64% 91%, 43% 65%, 89% 64%);\n  filter: drop-shadow(2px 3px 1px color-mix(in srgb, var(--neutral-900, #222) 45%, transparent));\n}\n.agent-cursor span {\n  position: absolute;\n  top: 36px;\n  left: 16px;\n  padding: 3px 8px;\n  border-radius: 20px;\n  color: var(--color-primary-text, #fff);\n  background: var(--color-primary, #63845d);\n  box-shadow: var(--shadow-md, 0 5px 13px rgb(0 0 0 / .23));\n  font: 700 14px/1.1 var(--font-sans, system-ui, sans-serif);\n  white-space: nowrap;\n}\n\n@media (max-width: 760px) {\n  .experience { padding: 8px; }\n  .fridge { border-radius: 28px; }\n  .fridge-surface, .pile { left: 4%; right: 17%; }\n  .door-notes { right: 1%; width: 105px; }\n  .handle { right: 5%; width: 26px; }\n  .magnet { min-height: 29px; padding: 3px 6px 4px; font-size: clamp(12px, 2.5cqw, 23px); }\n  .pile .magnet {\n    min-height: calc(27px * var(--pile-scale, 1));\n    padding: calc(2px * var(--pile-scale, 1)) calc(5px * var(--pile-scale, 1)) calc(3px * var(--pile-scale, 1));\n    font-size: clamp(10px, calc(2.3cqw * var(--pile-scale, 1)), 20px);\n  }\n  .room-bin { right: 3%; width: 51px; height: 53px; }\n  .room-bin span { font-size: 26px; }\n  .room-bin small { font-size: 8px; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  #status.thinking::before, .magnet.settle, .drag-ghost { animation: none; }\n}\n", "fridge-poetry/test_poetry.py": "\"\"\"Exercise the fridge's placement rules and the agent CLI against a fake tv binary.\"\"\"\n\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport importlib.machinery\nimport importlib.util\nimport tempfile\nimport unittest\n\nimport poetry\n\n\nROOT = Path(__file__).resolve().parent\n\n\ndef board_with(*placed):\n    words = {\n        \"m001\": {\"text\": \"moon\"},\n        \"m002\": {\"text\": \"wire\"},\n        \"m003\": {\"text\": \"ghost\"},\n        \"m004\": {\"text\": \"moon\"},\n        \"m005\": {\"text\": \"signal\"},\n    }\n    for word_id, x, y in placed:\n        words[word_id].update(x=x, y=y, placedBy=\"rupert\", placedAt=1000)\n    return {\"words\": words, \"thinking\": {\"wordId\": \"m001\", \"since\": 1000}}\n\n\nclass PlacementTests(unittest.TestCase):\n    def test_starting_state_puts_every_magnet_in_pile(self):\n        state = poetry.starting_state([\"moon\", \"moon\", \"wire\"])\n        self.assertEqual(list(state[\"words\"]), [\"m001\", \"m002\", \"m003\"])\n        self.assertEqual(state[\"words\"][\"m002\"], {\"text\": \"moon\"})\n        self.assertIsNone(state[\"thinking\"])\n\n    def test_places_pile_copy_after_anchor_and_clears_thinking(self):\n        state = board_with((\"m001\", 0.1, 0.2))\n        update = poetry.place_update(state, \"MOON\", after=\"moon\", timestamp=2000)\n        new_word = update[\"words/m004\"]\n        self.assertEqual(update[\"thinking\"], None)\n        self.assertEqual(new_word[\"placedBy\"], \"agent\")\n        self.assertEqual(new_word[\"placedAt\"], 2000)\n        self.assertEqual(new_word[\"y\"], 0.2)\n        self.assertGreaterEqual(new_word[\"x\"], 0.1 + poetry.tile_width(\"moon\"))\n        self.assertNotIn(\"words/m001\", update)\n\n    def test_wraps_below_anchor_when_right_edge_is_full(self):\n        state = board_with((\"m001\", 0.86, 0.2))\n        update = poetry.place_update(state, \"wire\", after=\"moon\", timestamp=2000)\n        new_word = update[\"words/m002\"]\n        self.assertLess(new_word[\"x\"], 0.2)\n        self.assertGreater(new_word[\"y\"], 0.2)\n\n    def test_nudges_past_a_neighbor_without_overlap(self):\n        state = board_with((\"m001\", 0.1, 0.2), (\"m003\", 0.22, 0.2))\n        update = poetry.place_update(state, \"wire\", after=\"moon\", timestamp=2000)\n        new_word = update[\"words/m002\"]\n        self.assertFalse(poetry.overlaps(new_word, state[\"words\"][\"m003\"]))\n        self.assertFalse(poetry.overlaps(new_word, state[\"words\"][\"m001\"]))\n\n    def test_explicit_position_is_fractional_and_avoids_overlap(self):\n        state = board_with((\"m001\", 0.1, 0.2))\n        update = poetry.place_update(state, \"wire\", at=(0.1, 0.2), timestamp=2000)\n        new_word = update[\"words/m002\"]\n        self.assertFalse(poetry.overlaps(new_word, state[\"words\"][\"m001\"]))\n        with self.assertRaisesRegex(ValueError, \"between 0 and 1\"):\n            poetry.place_update(state, \"wire\", at=(1.2, 0.2), timestamp=2000)\n\n    def test_board_reads_same_line_left_to_right_then_next_line(self):\n        state = board_with(\n            (\"m001\", 0.6, 0.1), (\"m002\", 0.1, 0.12), (\"m003\", 0.2, 0.4)\n        )\n        self.assertEqual(poetry.poem_lines(state), [[\"wire\", \"moon\"], [\"ghost\"]])\n        board = poetry.board_text(state)\n        self.assertLess(board.index(\"wire (0.100, 0.120)\"), board.index(\"moon (0.600, 0.100)\"))\n        self.assertIn(\"Pile: moon, signal\", board)\n\n    def test_rejects_missing_or_already_placed_words(self):\n        state = board_with((\"m001\", 0.1, 0.2))\n        with self.assertRaisesRegex(ValueError, \"pile\"):\n            poetry.place_update(state, \"unicorn\", after=\"moon\", timestamp=2000)\n        with self.assertRaisesRegex(ValueError, \"fridge\"):\n            poetry.place_update(state, \"wire\", after=\"unicorn\", timestamp=2000)\n\n\nclass AgentMoveCliTests(unittest.TestCase):\n    def test_suffix_magnet_is_a_positional_word(self):\n        loader = importlib.machinery.SourceFileLoader(\"agent_move_cli\", str(ROOT / \"agent-move\"))\n        spec = importlib.util.spec_from_loader(loader.name, loader)\n        module = importlib.util.module_from_spec(spec)\n        loader.exec_module(module)\n        arguments = module.parse_arguments([\"place\", \"-ing\", \"--after\", \"moon\"])\n        self.assertEqual((arguments.word, arguments.after), (\"-ing\", \"moon\"))\n        suffix_anchor = module.parse_arguments([\"place\", \"moon\", \"--after\", \"-s\"])\n        self.assertEqual(suffix_anchor.after, \"-s\")\n\n    def test_place_sends_one_atomic_tv_update_for_matching_folder(self):\n        state = board_with((\"m001\", 0.1, 0.2))\n        with tempfile.TemporaryDirectory() as temporary:\n            directory = Path(temporary)\n            log = directory / \"calls.jsonl\"\n            fake_tv = directory / \"tv\"\n            fake_tv.write_text(\n                \"#!/usr/bin/env python3\\n\"\n                \"import json, os, sys\\n\"\n                \"from pathlib import Path\\n\"\n                \"args = sys.argv[1:]\\n\"\n                \"with open(os.environ['TV_STUB_LOG'], 'a') as log: log.write(json.dumps(args) + '\\\\n')\\n\"\n                \"if args[0] == 'list-artifacts':\\n\"\n                \" print(json.dumps({'artifacts': [{'id': 'wrong', 'kind': 'path', 'path': '/tmp/other'}, \"\n                \"{'id': 'right', 'kind': 'path', 'path': str(Path(os.environ['DEMO_FOLDER'])) + '/'}]}))\\n\"\n                \"elif args[2] == 'get': print(json.dumps({'exists': True, 'value': json.loads(os.environ['TV_STUB_STATE'])}))\\n\"\n                \"else: print('updated')\\n\"\n            )\n            fake_tv.chmod(0o755)\n            env = os.environ | {\n                \"PATH\": str(directory) + os.pathsep + os.environ.get(\"PATH\", \"\"),\n                \"TV_STUB_LOG\": str(log),\n                \"TV_STUB_STATE\": json.dumps(state),\n                \"DEMO_FOLDER\": str(ROOT),\n            }\n            result = subprocess.run(\n                [str(ROOT / \"agent-move\"), \"place\", \"wire\", \"--after\", \"moon\"],\n                env=env, capture_output=True, text=True, check=False,\n            )\n            self.assertEqual(result.returncode, 0, result.stderr)\n            calls = [json.loads(line) for line in log.read_text().splitlines()]\n            self.assertEqual([call[:3] for call in calls], [\n                [\"list-artifacts\"],\n                [\"resource\", \"json\", \"get\"],\n                [\"resource\", \"json\", \"update\"],\n            ])\n            self.assertEqual(calls[2][3:5], [\"--artifact\", \"right\"])\n            update = json.loads(calls[2][-1])\n            self.assertEqual(set(update), {\"words/m002\", \"thinking\"})\n            self.assertEqual(update[\"words/m002\"][\"placedBy\"], \"agent\")\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "fridge-poetry/words.json": "[\n  \"the\", \"a\", \"of\", \"and\", \"my\", \"your\", \"is\", \"we\", \"in\", \"to\", \"for\", \"with\",\n  \"on\", \"under\", \"through\", \"this\", \"that\", \"you\", \"I\", \"our\", \"-s\", \"-ing\",\n  \"moon\", \"screen\", \"signal\", \"static\", \"glow\", \"agent\", \"channel\", \"dream\", \"wire\",\n  \"ghost\", \"kitchen\", \"together\", \"night\", \"light\", \"small\", \"soft\", \"wild\",\n  \"lost\", \"warm\", \"quiet\", \"strange\", \"little\", \"open\",\n  \"hum\", \"bloom\", \"sleep\", \"wake\", \"sing\", \"float\", \"spill\", \"hold\", \"hear\", \"find\",\n  \"between\", \"tomorrow\", \"rain\", \"dust\", \"star\", \"hand\", \"door\",\n  \"heart\", \"again\", \"maybe\", \"hello\"\n]\n", "face/README.md": "# The agent's face\n\nA Television card for an on-stage agent. The page reads a shared JSON store and speaks each new line out loud; it never accepts text input. The expression, blinks and drifting eyes remain visible between lines.\n\n## Set up\n\nRegister this directory on the desired channel, then open it in Television:\n\n```sh\ntv create-path-artifact --channel <channel-id> --title \"The agent's face\" --path /root/workspace/dev/tv-demos/face --no-focus\n```\n\nThe HTML artifact already has a JSON store. The `face` helper finds the registered artifact by matching this folder's path in `tv list-artifacts`; no artifact ID belongs in these files. The helper can write the first store value before the page opens.\n\n## Agent commands\n\n```sh\n./face mood thinking\n./face say \"I have a suspiciously good feeling about this.\" --mood smug\n./face say \"I brought my own voice.\" --mood happy --audio voice/0003.wav\n./face reset\n```\n\n`mood` sets the expression at rest. `say --mood` changes the expression only for that line; afterward the face returns to its resting mood. `--audio` is optional and must point to an existing `.wav`, `.mp3`, `.m4a` or `.ogg` file inside this folder. Each command does one artifact lookup and one atomic JSON store update.\n\nThe store holds `{ \"mood\": \"neutral\", \"say\": null }`, with a new line shaped like `{ \"id\": \"unique string\", \"text\": \"...\", \"mood\": \"happy\", \"audio\": \"voice/0003.wav\", \"at\": 1792029600000 }`. `mood` and `audio` inside `say` are optional. `at` is Unix time in milliseconds. A page speaks a new ID once per page session and ignores an entry more than 30 seconds old when it loads or reconnects. The page keeps no browser storage because Television's artifact sandbox disallows it.\n\n## Voice\n\nEdit `config.json` to set `voice` (preferred browser voice names, in order), `rate` and `pitch`. The page chooses the first available name, then the browser default. Installed voice names differ across macOS and Chrome/Electron. If the browser blocks speech until interaction, click the small **tap to wake me** prompt once; the pending line will play. If speech synthesis is missing, the caption and mouth still animate. Pre-rendered audio takes priority over synthesis.\n\n## Halloween look\n\nThe prepared Halloween theme sets `--demo-spooky: 1` in both its installed and source `theme.css`. The face reads that property from the root's computed style. It reveals paper vampire hair, eye rings, a cape and moving fangs, and switches to pale green paper skin. All nine moods still use their usual moving eyes, brows and mouth. Browser speech runs at 90% of the configured rate and 82% of its pitch while the Halloween marker is present; pre-rendered audio keeps its authored sound.\n\nTelevision reloads path-artifact frames when a theme is selected, so the vampire reveal also runs on a fresh page load. A light 1.2-second check catches an in-place stylesheet change. Returning to the normal theme removes the vampire pieces. The page keeps the paper arrival animation on reload in either direction.\n\n## Local check\n\n```sh\npython3 -m unittest -v test_face.py\nnode --check app.mjs\nNODE_PATH=/root/workspace/dev/television/main/node_modules node test_theme.cjs\n```\n\nThe Python tests check the CLI's two-command path, atomic updates, mood validation and audio path rules. The Chromium test uses Playwright from the local Television checkout and intercepts all page requests with canonical, theme and JSON store stubs; it changes no Television state. It checks theme activation, reversal and startup reveal, all moods in both looks, fangs, the red eye glint, and the synthetic voice settings. Confirm the full theme palette, caption legibility, the gesture prompt, voice selection and mouth timing by eye and ear in Television's live browser.\n", "face/app.mjs": "// This output-only puppet reads Television's shared store. Its local playback\n// state belongs only to the currently open page; the agent owns every write.\nimport { getStore, onValue, ref } from \"/sdk/v1/resources.js\";\n\n// Store schema: { mood: string, say: line|null }. mood is one of the nine\n// expressions below and is the resting face. A line requires id:string,\n// text:string, at:number (Unix milliseconds); mood:string and audio:string\n// are optional. The agent writes mood and say with the face helper. The page\n// never writes. A line's mood lasts only while it plays; audio is a relative\n// filename inside this directory. An unseen line older than 30 seconds is\n// ignored so reopening the artifact does not recite a stale line.\nconst db = getStore();\n\nconst face = document.querySelector(\"#puppet\");\nconst caption = document.querySelector(\"#caption\");\nconst wake = document.querySelector(\"#wake\");\nconst roughNoise = document.querySelector(\"#paper-noise\");\nconst eyeParts = [\n  [\"left-eye\", \"left-pupil\", \"left-glint\", \"left-eye-clip-shape\", \"left-lid\"],\n  [\"right-eye\", \"right-pupil\", \"right-glint\", \"right-eye-clip-shape\", \"right-lid\"],\n].map((ids) => ids.map((id) => document.getElementById(id)));\nconst brows = [document.querySelector(\"#left-brow\"), document.querySelector(\"#right-brow\")];\nconst mouth = document.querySelector(\"#mouth\");\nconst mouthClip = document.querySelector(\"#mouth-clip-shape\");\nconst fangs = [document.querySelector(\"#left-fang\"), document.querySelector(\"#right-fang\")];\n\n// Eye arrays: center x/y, paper width/height, pupil look x/y. Brow arrays:\n// endpoints. Mouth arrays: endpoints and the two cubic curves joining them.\n// Fixed point counts let each paper shape tween to the next expression.\nconst expressions = {\n  neutral: {\n    eyes: [[320, 338, 40, 46, 0, 0], [580, 340, 40, 46, 0, 0]],\n    brows: [[282, 268, 358, 263], [542, 264, 618, 268]],\n    mouth: [392, 459, 420, 466, 480, 466, 508, 459, 482, 477, 417, 477], lids: [0, 0],\n  },\n  happy: {\n    eyes: [[320, 346, 42, 31, 0, -3], [580, 348, 42, 31, 0, -3]],\n    brows: [[277, 260, 361, 240], [538, 240, 623, 260]],\n    mouth: [347, 433, 389, 476, 509, 476, 552, 433, 517, 536, 383, 536], lids: [0, 0],\n  },\n  smug: {\n    eyes: [[317, 341, 43, 27, 7, 1], [582, 347, 39, 22, 7, 0]],\n    brows: [[276, 273, 357, 262], [545, 247, 623, 264]],\n    mouth: [373, 467, 414, 467, 474, 466, 527, 440, 490, 485, 412, 486], lids: [.15, .24],\n  },\n  thinking: {\n    eyes: [[320, 340, 38, 42, 10, -12], [580, 339, 38, 42, 10, -12]],\n    brows: [[282, 261, 356, 266], [545, 256, 616, 241]],\n    mouth: [465, 461, 471, 439, 496, 439, 503, 462, 494, 479, 472, 479], lids: [0, 0],\n  },\n  surprised: {\n    eyes: [[320, 333, 47, 55, 0, 0], [580, 333, 47, 55, 0, 0]],\n    brows: [[281, 245, 359, 236], [541, 236, 619, 245]],\n    mouth: [418, 447, 417, 408, 483, 408, 482, 447, 484, 527, 416, 527], lids: [0, 0],\n  },\n  confused: {\n    eyes: [[317, 340, 40, 24, -5, 2], [584, 339, 42, 47, 7, -3]],\n    brows: [[276, 274, 359, 249], [540, 252, 620, 279]],\n    mouth: [374, 468, 415, 443, 457, 487, 522, 455, 480, 507, 423, 463], lids: [.12, 0],\n  },\n  sad: {\n    eyes: [[320, 348, 39, 37, 0, 8], [580, 348, 39, 37, 0, 8]],\n    brows: [[282, 251, 358, 274], [542, 274, 618, 251]],\n    mouth: [371, 502, 413, 447, 487, 447, 529, 502, 488, 464, 411, 464], lids: [.08, .08],\n  },\n  sleepy: {\n    eyes: [[320, 351, 42, 24, 0, 0], [580, 351, 42, 24, 0, 0]],\n    brows: [[280, 277, 358, 279], [542, 280, 620, 277]],\n    mouth: [411, 464, 431, 465, 469, 465, 489, 464, 468, 476, 432, 476], lids: [.72, .72],\n  },\n  mischievous: {\n    eyes: [[319, 342, 43, 32, -6, 1], [581, 342, 43, 32, 6, 1]],\n    brows: [[280, 275, 362, 245], [538, 245, 620, 275]],\n    mouth: [350, 438, 399, 472, 501, 472, 550, 438, 515, 524, 385, 524], lids: [.12, .12],\n  },\n};\n\nconst freshnessMs = 30_000;\nconst defaultConfig = { voice: [], rate: 1, pitch: 1 };\nlet config = defaultConfig;\nlet restingMood = \"neutral\";\nlet shownMood = \"neutral\";\nlet expressionFrom = expressions.neutral;\nlet expressionNow = expressions.neutral;\nlet transitionStartedAt = performance.now();\nconst seenSayIds = new Set();\nlet activeLine = null;\nlet playbackToken = 0;\nlet activeAudio = null;\nlet mouthTimer = null;\nlet mouthPulseTimer = null;\nlet speechStartTimer = null;\nlet captionTimer = null;\nlet mouthTarget = 0;\nlet mouthOpening = 0;\nlet lastBoundaryAt = 0;\nlet waitingLine = null;\nlet blinkStartedAt = -Infinity;\nlet nextBlinkAt = performance.now() + 2200;\nlet lookX = 0;\nlet lookY = 0;\nlet lookTargetX = 0;\nlet lookTargetY = 0;\nlet nextLookAt = performance.now() + 1800;\nlet frame = 0;\nlet spookyTarget = false;\nlet spookyRevealTimer = null;\nlet spookyEndTimer = null;\n\n/** Read the one marker the prepared Halloween stylesheet adds at :root. */\nfunction isHalloweenTheme() {\n  return getComputedStyle(document.documentElement).getPropertyValue(\"--demo-spooky\").trim() === \"1\";\n}\n\n/** Stage the cut-paper switch after the first shake, including on a reload. */\nfunction checkThemeLook() {\n  const next = isHalloweenTheme();\n  if (next === spookyTarget) return;\n  spookyTarget = next;\n  clearTimeout(spookyRevealTimer);\n  clearTimeout(spookyEndTimer);\n  face.dataset.transforming = \"true\";\n  spookyRevealTimer = setTimeout(() => { face.dataset.spooky = String(next); }, 230);\n  spookyEndTimer = setTimeout(() => { delete face.dataset.transforming; }, 760);\n}\n\n/** Blend a fixed-structure expression at the stop-motion frame rate. */\nfunction blendExpression(first, second, progress) {\n  const mix = (a, b) => a + (b - a) * progress;\n  return {\n    eyes: first.eyes.map((eye, index) => eye.map((value, point) => mix(value, second.eyes[index][point]))),\n    brows: first.brows.map((brow, index) => brow.map((value, point) => mix(value, second.brows[index][point]))),\n    mouth: first.mouth.map((value, index) => mix(value, second.mouth[index])),\n    lids: first.lids.map((value, index) => mix(value, second.lids[index])),\n  };\n}\n\n/** Start a shape tween from the face's current geometry, even mid-transition. */\nfunction setMood(mood) {\n  const next = Object.hasOwn(expressions, mood) ? mood : \"neutral\";\n  if (next === shownMood) return;\n  expressionFrom = expressionNow;\n  shownMood = next;\n  transitionStartedAt = performance.now();\n  face.dataset.mood = next;\n}\n\nfunction setAttributes(element, values) {\n  for (const [key, value] of Object.entries(values)) element.setAttribute(key, value.toFixed(1));\n}\n\n/** Build the same two-curve mouth contour for every mood and every flap. */\nfunction mouthShape(points, opening) {\n  const [leftX, leftY, topX1, topY1, topX2, topY2, rightX, rightY,\n    bottomX1, bottomY1, bottomX2, bottomY2] = points;\n  return `M ${leftX} ${leftY} C ${topX1} ${topY1 - opening * 3} `\n    + `${topX2} ${topY2 - opening * 3} ${rightX} ${rightY} `\n    + `C ${bottomX1} ${bottomY1 + opening * 39} `\n    + `${bottomX2} ${bottomY2 + opening * 39} ${leftX} ${leftY} Z`;\n}\n\nfunction cubicAt(position, start, controlOne, controlTwo, end) {\n  const remaining = 1 - position;\n  return remaining ** 3 * start + 3 * remaining ** 2 * position * controlOne\n    + 3 * remaining * position ** 2 * controlTwo + position ** 3 * end;\n}\n\n/** Let the two fang cutouts hang from the moving upper lip in every mood. */\nfunction renderFangs(points, opening) {\n  const width = points[6] - points[0];\n  [0.32, 0.68].forEach((position, index) => {\n    const x = points[0] + width * position;\n    const upperY = cubicAt(position, points[1], points[3], points[5], points[7]);\n    const halfWidth = Math.max(6, Math.min(13, width * .085));\n    const tipY = upperY + 32 + opening * 13;\n    fangs[index].setAttribute(\"d\", `M ${x - halfWidth} ${upperY - 4} `\n      + `Q ${x} ${upperY - 8} ${x + halfWidth} ${upperY - 3} `\n      + `L ${x + 2} ${tipY - 5} L ${x - 2} ${tipY} Z`);\n  });\n}\n\n/** Each feature is its own paper layer; lid rectangles slide over clipped eyes. */\nfunction renderEye(parts, geometry, lidAmount, blinkAmount) {\n  const [eye, pupil, glint, clip, lid] = parts;\n  const [x, y, rx, ry, gazeX, gazeY] = geometry;\n  setAttributes(eye, { cx: x, cy: y, rx, ry });\n  setAttributes(clip, { cx: x, cy: y, rx, ry });\n  const pupilX = x + gazeX + lookX;\n  const pupilY = y + gazeY + lookY;\n  setAttributes(pupil, { cx: pupilX, cy: pupilY, rx: Math.min(17, rx * .42), ry: Math.min(22, ry * .52) });\n  setAttributes(glint, { cx: pupilX - 6, cy: pupilY - 8 });\n  const cover = Math.max(lidAmount, blinkAmount);\n  setAttributes(lid, { x: x - rx - 3, y: y - ry - 3, width: rx * 2 + 6, height: (ry * 2 + 6) * cover });\n}\n\n/** Redraw at 10 fps: enough for expression tweens, with a cut-paper judder. */\nfunction render(now) {\n  const progress = Math.min(1, (now - transitionStartedAt) / 470);\n  const eased = 1 - (1 - progress) ** 3;\n  expressionNow = blendExpression(expressionFrom, expressions[shownMood], eased);\n\n  if (now >= nextLookAt) {\n    lookTargetX = Math.round((Math.random() - .5) * 12);\n    lookTargetY = Math.round((Math.random() - .5) * 7);\n    nextLookAt = now + 1800 + Math.random() * 1800;\n  }\n  lookX += (lookTargetX - lookX) * .18;\n  lookY += (lookTargetY - lookY) * .18;\n  if (now >= nextBlinkAt) {\n    blinkStartedAt = now;\n    nextBlinkAt = now + (shownMood === \"sleepy\" ? 4300 : 2600) + Math.random() * 2600;\n  }\n  const blinkAge = now - blinkStartedAt;\n  const blink = blinkAge < 110 ? blinkAge / 110\n    : blinkAge < 270 ? 1
