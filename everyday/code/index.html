"340\" rx=\"39\" ry=\"45\" />\n              <ellipse id=\"right-pupil\" class=\"pupil-paper\" cx=\"580\" cy=\"340\" rx=\"16\" ry=\"21\" />\n              <circle id=\"right-glint\" class=\"glint\" cx=\"574\" cy=\"333\" r=\"5\" />\n              <g clip-path=\"url(#right-eye-clip)\"><rect id=\"right-lid\" class=\"lid-paper\" x=\"530\" y=\"290\" width=\"100\" height=\"0\" /><\/g>\n            <\/g>\n\n            <path id=\"left-brow\" class=\"paper-piece brow brow-left\" />\n            <path id=\"right-brow\" class=\"paper-piece brow brow-right\" />\n\n            <path id=\"mouth\" class=\"paper-piece mouth-paper\" />\n            <g clip-path=\"url(#mouth-clip)\"><path id=\"teeth\" class=\"teeth-paper\" d=\"M 315 436 Q 450 457 586 430 L 575 448 Q 450 467 327 451 Z\" /><\/g>\n            <path id=\"left-fang\" class=\"paper-piece vampire-only fang-paper\" />\n            <path id=\"right-fang\" class=\"paper-piece vampire-only fang-paper\" />\n            <path class=\"nose-squiggle\" d=\"M 443 365 q -13 16 10 20 q 13 3 15 -8\" />\n            <rect class=\"all-grain\" x=\"160\" y=\"120\" width=\"575\" height=\"490\" fill=\"url(#fibers)\" clip-path=\"url(#body-clip)\" />\n          <\/g>\n        <\/g>\n      <\/svg>\n\n      <div id=\"caption\" class=\"caption\" role=\"status\" aria-live=\"polite\" hidden><\/div>\n      <button id=\"wake\" class=\"wake\" type=\"button\" hidden>tap to wake me<\/button>\n    <\/main>\n  <\/body>\n<\/html>\n", "face/style.css": "/* A full-bleed paper puppet. All paints and type come from the live canonical\n   token surface so a Television theme can recolor the collage in place. */\nhtml, body {\n  width: 100%;\n  height: 100%;\n  margin: 0;\n  overflow: hidden;\n}\n\nbody {\n  color: var(--color-text, #27232a);\n  background: var(--color-surface, #fbf8f0);\n  font-family: var(--font-sans, sans-serif);\n}\n\n.stage {\n  position: relative;\n  display: grid;\n  place-items: center;\n  width: 100%;\n  height: 100%;\n  isolation: isolate;\n  overflow: hidden;\n  background:\n    radial-gradient(circle at 12% 19%, var(--accent-alpha-10, rgb(99 102 241 / .1)), transparent 25%),\n    radial-gradient(circle at 84% 78%, var(--pink-alpha-10, rgb(236 72 153 / .1)), transparent 27%),\n    var(--color-surface, #fbf8f0);\n}\n\n/* Thin dots suggest a sheet of paper without baking in a theme-specific tint. */\n.stage::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  z-index: -1;\n  opacity: .26;\n  background-image: radial-gradient(var(--color-border, #bdb4b8) .65px, transparent .7px);\n  background-size: 19px 19px;\n}\n\n#puppet {\n  width: min(112vw, 140vh);\n  max-height: 106vh;\n  overflow: visible;\n  transform-origin: 50% 53%;\n  animation: paper-arrival 620ms steps(6, end) both;\n}\n\n#bob {\n  transform-origin: 450px 380px;\n  animation: puppet-breathe 5s steps(12, end) infinite;\n}\n\n.paper-piece {\n  filter: drop-shadow(3px 5px 2px var(--color-border, #b6aab1));\n  stroke: var(--color-text, #27232a);\n  stroke-width: 3.6;\n  stroke-linejoin: round;\n  stroke-linecap: round;\n  transition: fill 260ms steps(3, end), opacity 260ms steps(3, end);\n}\n\n.outer-face { fill: var(--yellow-300, #f9db68); stroke-width: 7; }\n.inner-face { fill: var(--color-surface-muted, #f3e8ed); stroke-width: 5; }\n.hair-left { fill: var(--orange-400, #fb923c); }\n.hair-right { fill: var(--pink-400, #f472b6); }\n.hair-middle { fill: var(--green-400, #4ade80); }\n.ear-left { fill: var(--purple-300, #d8b4fe); }\n.ear-right { fill: var(--cyan-300, #67e8f9); }\n.cheek { fill: var(--pink-300, #f9a8d4); stroke-width: 2.5; }\n.eye-paper { fill: var(--cyan-100, #cffafe); stroke-width: 4; }\n.pupil-paper { fill: var(--blue-700, #1d4ed8); stroke-width: 2; }\n.glint { fill: var(--color-surface, #fff); }\n.lid-paper { fill: var(--yellow-300, #f9db68); }\n.brow { fill: none; stroke-width: 15; }\n.brow-left { stroke: var(--purple-700, #7e22ce); }\n.brow-right { stroke: var(--green-700, #15803d); }\n.mouth-paper { fill: var(--red-600, #dc2626); stroke-width: 4.5; }\n.teeth-paper { fill: var(--color-surface, #fff); stroke: var(--color-text, #27232a); stroke-width: 2; opacity: 0; transition: opacity 300ms; }\n#puppet[data-mood=\"mischievous\"] .teeth-paper { opacity: 1; }\n.nose-squiggle { fill: none; stroke: var(--orange-700, #c2410c); stroke-width: 5; stroke-linecap: round; }\n.fiber { fill: var(--color-text, #27232a); opacity: .18; }\n.fiber-stroke { fill: none; stroke: var(--color-text, #27232a); stroke-width: .7; opacity: .14; }\n.all-grain { opacity: .43; pointer-events: none; }\n.doodles { fill: none; stroke: var(--accent-500, #6366f1); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }\n.doodles .star { fill: var(--yellow-300, #f9db68); stroke: var(--purple-600, #9333ea); stroke-width: 4; }\n\n/* The theme marker lives in Television's active theme CSS. These pieces keep\n   their own cut edges, grain overlay and shadows in both appearances. */\n.vampire-only { opacity: 0; transition: opacity 230ms steps(3, end); }\n.cape-outer { fill: var(--purple-950, #2e1065); stroke-width: 5; }\n.cape-lining { fill: var(--red-700, #b91c1c); stroke-width: 4; }\n.widow-hair { fill: var(--neutral-950, #171717); stroke-width: 5; }\n.eye-ring { fill: var(--purple-900, #581c87); stroke: var(--neutral-950, #171717); stroke-width: 2; }\n.fang-paper { fill: var(--neutral-50, #fafafa); stroke: var(--neutral-950, #171717); stroke-width: 3; }\n\n#puppet[data-spooky=\"true\"] .vampire-only { opacity: 1; }\n#puppet[data-spooky=\"true\"] .hair { opacity: 0; }\n#puppet[data-spooky=\"true\"] .outer-face { fill: var(--green-300, #86efac); }\n#puppet[data-spooky=\"true\"] .inner-face { fill: var(--green-100, #dcfce7); }\n#puppet[data-spooky=\"true\"] .cheek { fill: var(--green-200, #bbf7d0); opacity: .45; }\n#puppet[data-spooky=\"true\"] .eye-paper { fill: var(--neutral-100, #f5f5f5); }\n#puppet[data-spooky=\"true\"] .pupil-paper { fill: var(--neutral-950, #171717); }\n#puppet[data-spooky=\"true\"] .glint { fill: var(--red-500, #ef4444); }\n#puppet[data-spooky=\"true\"] .lid-paper { fill: var(--green-300, #86efac); }\n#puppet[data-spooky=\"true\"] .mouth-paper { fill: var(--red-900, #7f1d1d); }\n#puppet[data-spooky=\"true\"] .brow { stroke: var(--neutral-950, #171717); }\n#puppet[data-spooky=\"true\"] .nose-squiggle { stroke: var(--green-700, #15803d); }\n#puppet[data-transforming=\"true\"] #bob { animation: paper-transform 760ms steps(8, end) both; }\n\n.caption {\n  position: absolute;\n  left: 50%;\n  bottom: clamp(12px, 3vh, 36px);\n  max-width: min(78vw, 900px);\n  padding: .4em .9em .46em;\n  transform: translateX(-50%) rotate(-1.4deg);\n  color: var(--color-text, #27232a);\n  background: var(--color-surface, #fbf8f0);\n  border: 2px solid var(--color-border, #bdb4b8);\n  border-radius: 3px 7px 4px 6px;\n  box-shadow: 4px 5px 0 var(--yellow-300, #f9db68), 7px 9px 12px var(--color-border, #bdb4b8);\n  /* Local marker faces avoid an external font request in Television's sandbox. */\n  font-family: \"Marker Felt\", \"Bradley Hand\", var(--font-sans, sans-serif);\n  font-size: clamp(18px, 2.2vw, 31px);\n  font-weight: var(--font-weight-semibold, 600);\n  line-height: 1.13;\n  letter-spacing: .025em;\n  text-align: center;\n  text-wrap: balance;\n}\n\n.wake {\n  position: absolute;\n  right: var(--space-16, 16px);\n  bottom: var(--space-16, 16px);\n  z-index: 2;\n  padding: .4em .8em;\n  border: 1px solid var(--color-border, #bdb4b8);\n  border-radius: var(--radius-pill, 999px);\n  color: var(--color-text, #27232a);\n  background: var(--color-surface, #fbf8f0);\n  font: 500 var(--text-sm, 14px) var(--font-sans, sans-serif);\n  box-shadow: 2px 3px 0 var(--accent-300, #a5b4fc);\n  cursor: pointer;\n}\n\n.wake:focus-visible { outline: var(--outline-focus, 2px solid currentColor); }\n[hidden] { display: none !important; }\n\n@keyframes puppet-breathe {\n  0%, 100% { transform: translateY(0) rotate(-.4deg) scale(1); }\n  50% { transform: translateY(-7px) rotate(.5deg) scale(1.012); }\n}\n\n@keyframes paper-arrival {\n  0% { opacity: .35; transform: scale(.94) rotate(-2deg); }\n  30% { opacity: .8; transform: scale(1.025) rotate(1.5deg); }\n  65% { opacity: 1; transform: scale(.985) rotate(-.7deg); }\n  100% { opacity: 1; transform: scale(1) rotate(0); }\n}\n\n@keyframes paper-transform {\n  0%, 100% { transform: translateY(0) rotate(0) scale(1); }\n  25% { transform: translateY(-9px) rotate(-3deg) scale(1.025, .96); }\n  50% { transform: translateY(7px) rotate(2.5deg) scale(.975, 1.04); }\n  75% { transform: translateY(-5px) rotate(-1deg) scale(1.02, .98); }\n}\n\n@media (max-width: 680px) {\n  #puppet { width: 130vw; max-width: none; }\n  .caption { max-width: 90vw; bottom: 18px; }\n  .wake { top: 12px; right: 12px; bottom: auto; }\n}\n\n@media (prefers-reduced-motion: reduce) {\n  #bob, #puppet { animation: none; }\n}\n", "face/test_face.py": "\"\"\"Check the face helper's atomic commands with a fake Television CLI.\"\"\"\n\nimport importlib.machinery\nimport importlib.util\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport tempfile\nimport unittest\nfrom unittest.mock import patch\n\n\nROOT = Path(__file__).resolve().parent\nloader = importlib.machinery.SourceFileLoader(\"face_cli\", str(ROOT / \"face\"))\nspec = importlib.util.spec_from_loader(loader.name, loader)\nface_cli = importlib.util.module_from_spec(spec)\nloader.exec_module(face_cli)\n\n\nclass FaceHelperTests(unittest.TestCase):\n    def run_face(self, *arguments):\n        \"\"\"Record the two expected tv calls without touching a live artifact.\"\"\"\n        with tempfile.TemporaryDirectory() as temporary:\n            folder = Path(temporary)\n            log = folder / \"calls.jsonl\"\n            stub = folder / \"tv\"\n            stub.write_text(\n                \"#!/usr/bin/env python3\\n\"\n                \"import json, os, sys\\n\"\n                \"args = sys.argv[1:]\\n\"\n                \"with open(os.environ['TV_STUB_LOG'], 'a') as out: out.write(json.dumps(args) + '\\\\n')\\n\"\n                \"if args[0] == 'list-artifacts':\\n\"\n                \" print(json.dumps({'artifacts': [\"\n                \"{'id': 'other', 'kind': 'path', 'path': '/tmp/not-the-face'},\"\n                \"{'id': 'face-id', 'kind': 'path', 'path': os.environ['DEMO_FOLDER'] + '/'}]}))\\n\"\n                \"else: print('updated')\\n\"\n            )\n            stub.chmod(0o755)\n            environment = os.environ | {\n                \"PATH\": str(folder) + os.pathsep + os.environ.get(\"PATH\", \"\"),\n                \"TV_STUB_LOG\": str(log),\n                \"DEMO_FOLDER\": str(ROOT),\n            }\n            result = subprocess.run(\n                [str(ROOT / \"face\"), *arguments], env=environment,\n                capture_output=True, text=True, check=False,\n            )\n            calls = [json.loads(line) for line in log.read_text().splitlines()] if log.exists() else []\n            return result, calls\n\n    def test_say_writes_one_fresh_line_with_temporary_mood(self):\n        result, calls = self.run_face(\"say\", \"A small paper miracle.\", \"--mood\", \"smug\")\n        self.assertEqual(result.returncode, 0, result.stderr)\n        self.assertEqual([call[:3] for call in calls], [\n            [\"list-artifacts\"], [\"resource\", \"json\", \"update\"],\n        ])\n        self.assertEqual(calls[1][3:5], [\"--artifact\", \"face-id\"])\n        update = json.loads(calls[1][-1])\n        self.assertEqual(set(update), {\"say\"})\n        self.assertEqual(update[\"say\"][\"text\"], \"A small paper miracle.\")\n        self.assertEqual(update[\"say\"][\"mood\"], \"smug\")\n        self.assertEqual(len(update[\"say\"][\"id\"]), 32)\n        self.assertIsInstance(update[\"say\"][\"at\"], int)\n\n    def test_mood_and_reset_each_make_one_atomic_update(self):\n        for arguments, expected in [\n            ((\"mood\", \"sleepy\"), {\"mood\": \"sleepy\"}),\n            ((\"reset\",), {\"mood\": \"neutral\", \"say\": None}),\n        ]:\n            with self.subTest(arguments=arguments):\n                result, calls = self.run_face(*arguments)\n                self.assertEqual(result.returncode, 0, result.stderr)\n                self.assertEqual(len(calls), 2)\n                self.assertEqual(json.loads(calls[1][-1]), expected)\n\n    def test_rejects_unknown_mood_before_tv_lookup(self):\n        result, calls = self.run_face(\"mood\", \"furious\")\n        self.assertEqual(result.returncode, 2)\n        self.assertIn(\"neutral\", result.stderr)\n        self.assertIn(\"mischievous\", result.stderr)\n        self.assertEqual(calls, [])\n\n    def test_audio_must_exist_inside_folder_and_cannot_escape(self):\n        with tempfile.TemporaryDirectory() as temporary:\n            folder = Path(temporary)\n            (folder / \"voice\").mkdir()\n            (folder / \"voice\" / \"0003.wav\").write_bytes(b\"RIFF\")\n            with patch.object(face_cli, \"FOLDER\", folder):\n                self.assertEqual(face_cli.audio_path(\"voice/0003.wav\"), \"voice/0003.wav\")\n                for filename in (\"../outside.wav\", \"/tmp/file.wav\", \"https://x/y.wav\", \"voice/missing.wav\"):\n                    with self.subTest(filename=filename), self.assertRaises(ValueError):\n                        face_cli.audio_path(filename)\n\n    def test_empty_say_does_not_contact_tv(self):\n        result, calls = self.run_face(\"say\", \"   \")\n        self.assertEqual(result.returncode, 1)\n        self.assertIn(\"cannot be empty\", result.stderr)\n        self.assertEqual(calls, [])\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "face/test_theme.cjs": "/** Exercise the real page in Chromium with local canonical, theme and store stubs. */\n\nconst assert = require(\"node:assert/strict\");\nconst fs = require(\"node:fs\");\nconst path = require(\"node:path\");\nconst { chromium } = require(\"playwright\");\n\nconst folder = __dirname;\nconst moods = [\n  \"neutral\", \"happy\", \"smug\", \"thinking\", \"surprised\", \"confused\",\n  \"sad\", \"sleepy\", \"mischievous\",\n];\nlet themeMarker = \"0\";\n\n/** Fulfill only this page and its local dependencies; no server is needed. */\nasync function respond(route) {\n  const pathname = new URL(route.request().url()).pathname;\n  const stubs = {\n    \"/canonical/v2/styles.css\": [\"text/css\", '@import url(\"/canonical/v2/base.css\");\\n@import url(\"/theme/theme.css\");\\n'],\n    \"/canonical/v2/base.css\": [\"text/css\", `:root {\n      --color-surface: #fbf8f0; --color-surface-muted: #f3e8ed;\n      --color-text: #27232a; --color-border: #b6aab1;\n      --green-100: #dcfce7; --green-300: #86efac;\n      --neutral-950: #171717; --red-500: #ef4444;\n    }`],\n    \"/canonical/v2/components.js\": [\"text/javascript\", \"\"],\n    \"/sdk/v1/resources.js\": [\"text/javascript\", `\n      export const getStore = () => ({});\n      export const ref = () => ({});\n      export function onValue(_reference, callback) {\n        window.__emitFaceStore = (value) => callback({ val: () => value });\n        window.__emitFaceStore({ mood: \"neutral\", say: null });\n      }\n    `],\n  };\n  if (pathname === \"/theme/theme.css\") {\n    await route.fulfill({ contentType: \"text/css\", body: `:root { --demo-spooky: ${themeMarker}; }` });\n    return;\n  }\n  if (stubs[pathname]) {\n    await route.fulfill({ contentType: stubs[pathname][0], body: stubs[pathname][1] });\n    return;\n  }\n  const filename = pathname === \"/\" ? \"index.html\" : pathname.slice(1);\n  if (![\"index.html\", \"style.css\", \"app.mjs\", \"config.json\"].includes(filename)) {\n    await route.fulfill({ status: 404 });\n    return;\n  }\n  const mime = filename.endsWith(\".css\") ? \"text/css\"\n    : filename.endsWith(\".mjs\") ? \"text/javascript\"\n      : filename.endsWith(\".json\") ? \"application/json\" : \"text/html\";\n  await route.fulfill({ contentType: mime, body: fs.readFileSync(path.join(folder, filename)) });\n}\n\nasync function setMood(page, mood) {\n  await page.evaluate((next) => window.__emitFaceStore({ mood: next, say: null }), mood);\n  await page.waitForTimeout(560);\n  const visibleMood = await page.locator(\"#puppet\").getAttribute(\"data-mood\");\n  assert.equal(visibleMood, mood);\n  return page.locator(\"#mouth\").getAttribute(\"d\");\n}\n\nasync function checkMoods(page) {\n  const shapes = new Set();\n  for (const mood of moods) shapes.add(await setMood(page, mood));\n  assert.equal(shapes.size, moods.length, \"all nine moods need distinct mouth contours\");\n}\n\nasync function say(page, id, expectMovingFangs = false) {\n  const idleFang = expectMovingFangs ? await page.locator(\"#left-fang\").getAttribute(\"d\") : null;\n  await page.evaluate((lineId) => window.__emitFaceStore({\n    mood: \"neutral\", say: { id: lineId, text: \"A little paper voice.\", at: Date.now() },\n  }), id);\n  await page.waitForFunction(() => window.__spoken.length > 0);\n  if (expectMovingFangs) {\n    await page.waitForFunction((previous) => document.querySelector(\"#left-fang\").getAttribute(\"d\") !== previous, idleFang);\n  }\n  return page.evaluate(() => window.__spoken.shift());\n}\n\nasync function captureIfRequested(page, name) {\n  const directory = process.env.FACE_SCREENSHOT_DIR;\n  if (!directory) return;\n  fs.mkdirSync(directory, { recursive: true });\n  await setMood(page, \"neutral\");\n  await page.waitForFunction(() => Number(document.querySelector(\"#left-lid\").getAttribute(\"height\")) < 1\n    && Number(document.querySelector(\"#right-lid\").getAttribute(\"height\")) < 1);\n  await page.screenshot({ path: path.join(directory, `${name}.png`) });\n}\n\nasync function main() {\n  const browser = await chromium.launch({ headless: true, args: [\"--no-sandbox\"] });\n  try {\n    const page = await browser.newPage({ viewport: { width: 1100, height: 800 } });\n    const errors = [];\n    page.on(\"pageerror\", (error) => errors.push(error.message));\n    await page.route(\"**/*\", respond);\n    await page.addInitScript(() => {\n      window.__spoken = [];\n      window.SpeechSynthesisUtterance = class {\n        constructor(text) { this.text = text; }\n      };\n      Object.defineProperty(window, \"speechSynthesis\", { configurable: true, value: {\n        getVoices: () => [], cancel: () => {}, resume: () => {},\n        speak: (utterance) => {\n          window.__spoken.push({ rate: utterance.rate, pitch: utterance.pitch });\n          setTimeout(() => utterance.onstart?.(), 0);\n          setTimeout(() => utterance.onboundary?.({ charIndex: 0 }), 90);\n          setTimeout(() => utterance.onend?.(), 650);\n        },\n      } });\n    });\n    await page.goto(\"http://face.test/\");\n    await page.waitForFunction(() => typeof window.__emitFaceStore === \"function\");\n    assert.equal(await page.locator(\"#puppet\").getAttribute(\"data-spooky\"), \"false\");\n    await checkMoods(page);\n    await captureIfRequested(page, \"normal\");\n    assert.deepEqual(await say(page, \"normal-line\"), { rate: 1, pitch: 1 });\n\n    const markerStyle = await page.addStyleTag({ content: \":root { --demo-spooky: 1; }\" });\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.transforming === \"true\");\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.spooky === \"true\");\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.transforming === undefined);\n    await page.waitForFunction(() => getComputedStyle(document.querySelector(\".inner-face\")).fill === \"rgb(220, 252, 231)\");\n    const skin = await page.locator(\".inner-face\").evaluate((element) => getComputedStyle(element).fill);\n    assert.equal(skin, \"rgb(220, 252, 231)\");\n    assert.equal(await page.locator(\"#left-glint\").evaluate((element) => getComputedStyle(element).fill), \"rgb(239, 68, 68)\");\n    const fang = page.locator(\"#left-fang\");\n    assert.ok((await fang.getAttribute(\"d\")).startsWith(\"M \"));\n    assert.equal(await fang.evaluate((element) => getComputedStyle(element).opacity), \"1\");\n    await checkMoods(page);\n    await captureIfRequested(page, \"vampire\");\n    assert.deepEqual(await say(page, \"spooky-line\", true), { rate: .9, pitch: .82 });\n\n    await markerStyle.evaluate((element) => element.remove());\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.spooky === \"false\");\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.transforming === undefined);\n    await page.waitForFunction(() => getComputedStyle(document.querySelector(\"#left-fang\")).opacity === \"0\");\n    assert.equal(await fang.evaluate((element) => getComputedStyle(element).opacity), \"0\");\n\n    // Television reloads path artifacts on theme selection. The startup path\n    // must reveal the vampire again with the marker already in the sheet.\n    themeMarker = \"1\";\n    await page.reload();\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.transforming === \"true\");\n    await page.waitForFunction(() => document.querySelector(\"#puppet\").dataset.spooky === \"true\");\n    assert.deepEqual(errors, []);\n    console.log(\"Chromium: marker polling, startup reveal, reverse switch, nine moods in both looks, fangs and voice settings passed\");\n  } finally {\n    await browser.close();\n  }\n}\n\nmain().catch((error) => { console.error(error); process.exitCode = 1; });\n", "tune/README.md": "# Colour study\n\nThis Television card pairs a full-screen animated colour field with eight small controls. Rupert can tune it by hand; an agent can tune the same controls through `./tune`. The five displayed hex colours are the exact palette sent to the shader. Click a swatch to copy its value, Save to keep a colourway, or Download for a screen-resolution PNG of the current frame.\n\n## Register\n\nThe reviewer registers this folder on the intended channel:\n\n```sh\ntv create-path-artifact --channel <channel-id> --title \"Colour study\" --path /root/workspace/dev/tv-demos/tune --no-focus\n```\n\nOpen the card once to initialize its JSON store. The page needs write access to change controls or save colourways.\n\n## Shared store\n\n```json\n{\n  \"params\": {\"colour\": 0.6, \"spread\": 0.48, \"variety\": 0.68, \"speed\": 0.34, \"swirl\": 0.52, \"scale\": 0.52, \"glow\": 0.54, \"grain\": 0.28},\n  \"palette\": [\"#063933\", \"#0e5b7e\", \"#175fcc\", \"#eb4973\", \"#af8ef2\"],\n  \"saved\": {\"<key>\": {\"name\": \"Ocean dusk\", \"params\": {\"colour\": 0.6, \"spread\": 0.48, \"variety\": 0.68, \"speed\": 0.34, \"swirl\": 0.52, \"scale\": 0.52, \"glow\": 0.54, \"grain\": 0.28}, \"palette\": [\"#063933\", \"#0e5b7e\", \"#175fcc\", \"#eb4973\", \"#af8ef2\"], \"savedAt\": 1792020000000}}\n}\n```\n\nEvery parameter is a number from 0 to 1. `variety=0` keeps the earlier close hues; increasing it moves an accent through neighbouring hues toward a complement. `colour` rotates the whole palette. `palette` holds five derived hex colours; the page and helper write it alongside changed parameters. Each saved entry contains a full parameter object, its matching five colours, a short name and a Unix millisecond timestamp. The page writes entries at `saved/<key>` and shows them as clickable chips.\n\nWhen an existing card has the earlier seven-control store, the page adds `variety` and refreshes the palette on its next writable load.\n\n## Agent commands\n\n```sh\n./tune get\n./tune set colour=0.08 variety=0.75 swirl=0.72 glow=0.8\n./tune preset storm\n./tune reset\n./tune palette\n./tune saved\n./theme\n```\n\nAvailable presets: `dusk`, `ocean`, `ember`, `calm`, `storm`. Ocean uses blues and teals with a coral accent; ember stays within warm neighbours; storm adds an electric contrast. `set` accepts any of the eight parameter names and clamps numeric values to 0\u20131. The helper finds the registered artifact by matching this folder path in `tv list-artifacts`; no artifact ID is stored in the card.\n\n## Theme the Television app\n\nRun `./theme` after tuning the card. It reads the current five-colour palette, writes `manifest.json` and `theme.css` to `/root/.television/themes/demo-colour-study/`, then selects that theme with `tv set-theme demo-colour-study`. The palette supplies the surfaces, accent, links and a softened five-stop wallpaper; text lightness is adjusted to meet at least 4.5:1 contrast on the surfaces. The package uses a fixed dark or light appearance according to the palette.\n\nBefore the first selection, the helper records the previous theme ID in `/root/workspace/dev/tv-demos/.previous-theme`. Later runs leave that file intact. To restore it, run `tv set-theme \"$(cat /root/workspace/dev/tv-demos/.previous-theme)\"`.\n\nFor a file-only preview, run `./theme --no-apply --out /tmp/demo-colour-study`. The helper still reads the card store through `tv`; it skips theme selection and does not create the previous-theme file.\n\n## Checks\n\n```sh\npython3 -m unittest -v test_tune.py\npython3 -m unittest -v test_theme.py\nnode --test palette.test.mjs\n```\n\nThe Python suites run the executables with a stub `tv` command and check the store payload, theme mapping, contrast, CSS tokens, file output and activation call. A local headless Chromium check also loaded the page, moved a slider, saved a colourway, received an agent update and downloaded a PNG without page or console errors.\n", "tune/app.mjs": "// One living canvas and one shared Television JSON store. Human input renders\n// immediately, then writes params and palette; incoming agent values ease both\n// the shader and the native slider thumbs for one visible second.\nimport {\n  getStore, onAccessChanged, onConnectionStatusChanged, onValue,\n  ref, runTransaction, update,\n} from \"/sdk/v1/resources.js\";\nimport { DEFAULTS, nameFor, normalizeParams, paletteFor } from \"./palette.mjs\";\n\nconst db = getStore();\nconst root = ref(db);\nconst canvas = document.querySelector(\"#art\");\nconst slidersElement = document.querySelector(\"#sliders\");\nconst paletteElement = document.querySelector(\"#palette\");\nconst savedElement = document.querySelector(\"#saved\");\nconst noticeElement = document.querySelector(\"#notice\");\nconst errorElement = document.querySelector(\"#error\");\nconst sliderNames = Object.keys(DEFAULTS);\nconst sliders = new Map();\nconst swatches = [];\n\nlet state = null;\nlet target = { ...DEFAULTS };\nlet display = { ...DEFAULTS };\nlet transition = null;\nlet writeTimer = null;\nlet noticeTimer = null;\nconst pendingSignatures = new Set();\nlet access = null;\nlet connection = \"connecting\";\nlet isEmpty = false;\nlet initializing = false;\nlet lastPalette = \"\";\n\nfunction signature(params) {\n  return JSON.stringify(sliderNames.map((name) => params[name]));\n}\n\nfunction canWrite() {\n  return access === \"read-write\" && connection === \"connected\";\n}\n\nfunction showError(failure) {\n  const message = failure?.code === \"disconnected\"\n    ? \"Connection lost. Your last change may still have saved.\"\n    : failure?.code === \"read-only\" ? \"This view can only read the artwork.\"\n      : failure ? `Could not save: ${failure.message || failure}` : \"\";\n  errorElement.textContent = message;\n  errorElement.hidden = !message;\n}\n\nfunction showNotice(message) {\n  noticeElement.textContent = message;\n  noticeElement.classList.add(\"visible\");\n  clearTimeout(noticeTimer);\n  noticeTimer = setTimeout(() => noticeElement.classList.remove(\"visible\"), 2600);\n}\n\n/** Draw the swatches from the same interpolated values used by the shader. */\nfunction renderPalette() {\n  const palette = paletteFor(display);\n  const key = palette.join(\"\");\n  if (key === lastPalette) return;\n  lastPalette = key;\n  palette.forEach((colour, index) => {\n    swatches[index].style.backgroundColor = colour;\n    swatches[index].querySelector(\"span\").textContent = colour;\n    swatches[index].dataset.colour = colour;\n    swatches[index].setAttribute(\"aria-label\", `Copy ${colour}`);\n  });\n}\n\nfunction renderSaved() {\n  savedElement.replaceChildren();\n  const saved = state?.saved && typeof state.saved === \"object\" ? state.saved : {};\n  for (const [key, entry] of Object.entries(saved).sort((a, b) => (b[1]?.savedAt || 0) - (a[1]?.savedAt || 0))) {\n    if (!entry?.params || !Array.isArray(entry.palette)) continue;\n    const button = document.createElement(\"button\");\n    button.type = \"button\";\n    button.textContent = entry.name || \"Saved colour\";\n    button.title = `Restore ${button.textContent}`;\n    button.style.background = `linear-gradient(105deg, ${entry.palette.join(\", \")})`;\n    button.addEventListener(\"click\", () => {\n      if (!canWrite()) return;\n      useLocalParams(normalizeParams(entry.params));\n      void persistParams();\n      showNotice(`restored ${button.textContent.toLowerCase()}`);\n    });\n    button.disabled = !canWrite();\n    savedElement.append(button);\n  }\n}\n\nfunction renderAccess() {\n  for (const slider of sliders.values()) slider.disabled = !canWrite();\n  document.querySelector(\"#save\").disabled = !canWrite();\n  renderSaved();\n}\n\nfunction useLocalParams(params) {\n  transition = null;\n  target = { ...params };\n  display = { ...params };\n  for (const [name, slider] of sliders) slider.value = String(target[name]);\n  renderPalette();\n}\n\nasync function persistParams() {\n  if (!canWrite()) return;\n  const params = { ...target };\n  const writtenSignature = signature(params);\n  pendingSignatures.add(writtenSignature);\n  try {\n    await update(root, { params, palette: paletteFor(params) });\n    showError(null);\n  } catch (failure) { pendingSignatures.delete(writtenSignature); showError(failure); }\n}\n\nfunction scheduleWrite() {\n  clearTimeout(writeTimer);\n  writeTimer = setTimeout(() => void persistParams(), 110);\n}\n\nfunction receiveParams(params) {\n  const next = normalizeParams(params);\n  const nextSignature = signature(next);\n  const isOwnWrite = pendingSignatures.delete(nextSignature);\n  if (nextSignature === signature(target)) return;\n  if (isOwnWrite) return;\n  clearTimeout(writeTimer);\n  transition = { from: { ...display }, to: next, started: performance.now() };\n  target = next;\n  showNotice(\"agent tuned this\");\n}\n\nasync function initialize() {\n  if (!isEmpty || !canWrite() || initializing) return;\n  initializing = true;\n  try {\n    await runTransaction(root, (current) => {\n      if (current !== undefined && current !== null) return undefined;\n      return { params: { ...DEFAULTS }, palette: paletteFor(DEFAULTS), saved: {} };\n    });\n    showError(null);\n  } catch (failure) { showError(failure); }\n  finally { initializing = false; }\n}\n\nfor (const name of sliderNames) {\n  const row = document.createElement(\"div\");\n  row.className = \"slider-row\";\n  const label = document.createElement(\"label\");\n  label.htmlFor = `slider-${name}`;\n  label.textContent = name[0].toUpperCase() + name.slice(1);\n  const slider = document.createElement(\"input\");\n  slider.type = \"range\";\n  slider.id = label.htmlFor;\n  slider.min = \"0\";\n  slider.max = \"1\";\n  slider.step = \"0.001\";\n  slider.value = String(DEFAULTS[name]);\n  slider.disabled = true;\n  slider.addEventListener(\"input\", () => {\n    useLocalParams({ ...target, [name]: Number(slider.value) });\n    scheduleWrite();\n  });\n  row.append(label, slider);\n  slidersElement.append(row);\n  sliders.set(name, slider);\n}\n\nfor (let index = 0; index < 5; index++) {\n  const button = document.createElement(\"button\");\n  button.type = \"button\";\n  button.className = \"swatch\";\n  button.innerHTML = \"<span><\/span>\";\n  button.addEventListener(\"click\", async () => {\n    const colour = button.dataset.colour;\n    try {\n      await navigator.clipboard.writeText(colour);\n    } catch {\n      const field = document.createElement(\"textarea\");\n      field.value = colour;\n      document.body.append(field);\n      field.select();\n      document.execCommand(\"copy\");\n      field.remove();\n    }\n    showNotice(`${colour} copied`);\n  });\n  paletteElement.append(button);\n  swatches.push(button);\n}\nrenderPalette();\n\ndocument.querySelector(\"#collapse\").addEventListener(\"click\", (event) => {\n  const panel = document.querySelector(\"#controls\");\n  const collapsed = panel.classList.toggle(\"collapsed\");\n  event.currentTarget.textContent = collapsed ? \"+\" : \"\u2212\";\n  event.currentTarget.setAttribute(\"aria-expanded\", String(!collapsed));\n  event.currentTarget.setAttribute(\"aria-label\", collapsed ? \"Expand controls\" : \"Collapse controls\");\n});\n\ndocument.querySelector(\"#save\").addEventListener(\"click\", async () => {\n  if (!canWrite()) return;\n  clearTimeout(writeTimer);\n  const params = { ...target };\n  const palette = paletteFor(params);\n  const name = nameFor(params);\n  const key = `s${Date.now().toString(36)}${Math.random().toString(36).slice(2, 5)}`;\n  try {\n    await update(root, {\n      params, palette,\n      [`saved/${key}`]: { name, params, palette, savedAt: Date.now() },\n    });\n    showNotice(`saved ${name.toLowerCase()}`);\n    showError(null);\n  } catch (failure) { showError(failure); }\n});\n\ndocument.querySelector(\"#download\").addEventListener(\"click\", () => {\n  // Paint the current frame into a screen-resolution PNG even when the live\n  // shader uses fewer pixels to stay smooth on a large projector.\n  const wallpaper = document.createElement(\"canvas\");\n  const ratio = window.devicePixelRatio || 1;\n  wallpaper.width = Math.round(canvas.clientWidth * ratio);\n  wallpaper.height = Math.round(canvas.clientHeight * ratio);\n  wallpaper.getContext(\"2d\").drawImage(canvas, 0, 0, wallpaper.width, wallpaper.height);\n  wallpaper.toBlob((blob) => {\n    if (!blob t scale;\nuniform float glow;\nuniform float grain;\nuniform vec3 colours[5];\n\nfloat hash(vec2 p) {\n  return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);\n}\nfloat noise(vec2 p) {\n  vec2 i = floor(p), f = fract(p);\n  f = f*f*(3.0-2.0*f);\n  return mix(mix(hash(i), hash(i+vec2(1.,0.)), f.x),\n             mix(hash(i+vec2(0.,1.)), hash(i+vec2(1.,1.)), f.x), f.y);\n}\nfloat field(vec2 p) {\n  return noise(p)*0.58 + noise(p*2.03)*0.28 + noise(p*4.07)*0.14;\n}\nvec3 palette(float v) {\n  float x = clamp(v, 0., .9999)*4.;\n  if (x < 1.) return mix(colours[0], colours[1], smoothstep(0.,1.,x));\n  if (x < 2.) return mix(colours[1], colours[2], smoothstep(0.,1.,x-1.));\n  if (x < 3.) return mix(colours[2], colours[3], smoothstep(0.,1.,x-2.));\n  return mix(colours[3], colours[4], smoothstep(0.,1.,x-3.));\n}\nvoid main() {\n  vec2 uv = gl_FragCoord.xy / resolution.xy;\n  vec2 p = (uv-.5)*vec2(resolution.x/resolution.y,1.);\n  float zoom = mix(1.5, 4.8, scale);\n  vec2 q = p*zoom;\n  float bend = field(q*.85 + vec2(time*.16, -time*.12));\n  float twist = swirl * 1.95;\n  q += vec2(sin(q.y*1.8 + time*.37), cos(q.x*1.4-time*.29))*bend*twist;\n  q += vec2(noise(q + 5.8 + time*.1), noise(q + 13.6 - time*.09)) * twist*.32;\n  float ribbon = q.y*.67 + q.x*.21 + sin(q.x*.72 + time*.32)*.32;\n  ribbon += (field(q*.72 + vec2(time*.16,-time*.09))-.5)*(.4 + twist*1.45);\n  float waves = sin(ribbon*3.5)*.24 + sin(ribbon*1.72+1.3)*.15;\n  float value = clamp(.51 + waves*1.28 + (bend-.5)*.34 + p.x*.08, 0., 1.);\n  vec3 colour = palette(value);\n  // Carry the contrasting swatch through the folded paint itself.\n  float accent = pow(max(0., sin(ribbon*3.5+.3)), 4.);\n  colour = mix(colour, colours[3], accent*.30);\n  float seam = pow(max(0., cos(ribbon*3.5+1.25)), 18.);\n  colour += colours[4]*seam*(.035 + glow*.17);\n  float light = .80 + .32*smoothstep(-.35,.65, noise(q*.43+time*.06));\n  colour *= light;\n  float dust = hash(gl_FragCoord.xy + fract(time*11.)*100.)-.5;\n  colo ding: 8px; border: 1px solid rgba(255,255,255,.17); border-radius: 7px; cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,.12); transition: transform .18s, background-color .24s; }\n.swatch:hover, .swatch:focus-visible { transform: translateY(-4px); outline: 1px solid rgba(255,255,255,.8); }\n.swatch span { padding: 2px 3px; border-radius: 3px; color: white; background: rgba(0,0,0,.25); font-family: var(--font-mono, monospace); font-size: 9px; letter-spacing: .015em; }\n.store-error { position: absolute; right: 24px; bottom: 20px; max-width: 280px; padding: 10px 14px; background: rgba(67,15,23,.85); border-radius: 8px; font-size: 11px; }\n@media (max-width: 650px) { .title-block { top: 28px; } h1 { font-size: 44px; } .controls { top: auto; bottom: 150px; right: 20px; width: 210px; } .controls:not(.collapsed) { bottom: 115px; } .palette-wrap { bottom: 22px; } }\n", "tune/test_theme.py": "\"\"\"Check palette-to-theme mapping and the executable through a stub tv CLI.\"\"\"\n\nimport json\nimport os\nfrom pathlib import Path\nimport random\nimport re\nimport subprocess\nimport tempfile\nimport unittest\n\nfrom theme_style import contrast_ratio, map_palette, render_css\nfrom tune_state import DEFAULTS, palette_for\n\n\nROOT = Path(__file__).resolve().parent\nEXAMPLES = [Path(\"/root/.television/themes/demo-halloween/theme.css\"),\n            Path(\"/root/.television/themes/zen-ink/theme.css\")]\n\n\nclass ThemeMappingTests(unittest.TestCase):\n    def test_dark_palette_maps_to_readable_dark_app(self):\n        colours = palette_for(DEFAULTS)\n        mapped = map_palette(colours, DEFAULTS)\n        self.assertEqual(mapped[\"scheme\"], \"dark\")\n        for surface in (\"surface\", \"surfaceMuted\", \"sidebar\", \"titlebar\"):\n            self.assertGreaterEqual(contrast_ratio(mapped[\"text\"], mapped[surface]), 4.5)\n            self.assertGreaterEqual(contrast_ratio(mapped[\"textMuted\"], mapped[surface]), 4.5)\n            self.assertGreaterEqual(contrast_ratio(mapped[\"link\"], mapped[surface]), 4.5)\n        self.assertGreaterEqual(contrast_ratio(mapped[\"channelSelectedText\"], mapped[\"accent\"]), 4.5)\n\n    def test_light_palette_maps_to_readable_light_app(self):\n        colours = [\"#ffedc2\", \"#c7efd8\", \"#f9dce6\", \"#d8e2ff\", \"#fff8ed\"]\n        mapped = map_palette(colours, DEFAULTS)\n        self.assertEqual(mapped[\"scheme\"], \"light\")\n        for surface in (\"surface\", \"surfaceMuted\", \"sidebar\", \"titlebar\"):\n            self.assertGreaterEqual(contrast_ratio(mapped[\"text\"], mapped[surface]), 4.5)\n            self.assertGreaterEqual(contrast_ratio(mapped[\"textMuted\"], mapped[surface]), 4.5)\n            self.assertGreaterEqual(contrast_ratio(mapped[\"link\"], mapped[surface]), 4.5)\n        self.assertGreaterEqual(contrast_ratio(mapped[\"channelSelectedText\"], mapped[\"accent\"]), 4.5)\n\n    def test_mixed_palettes_keep_text_readable(self):\n        generator = random.Random(44)\n        for _ in range(100):\n            colours = [\"#\" + \"\".join(f\"{generator.randrange(256):02x}\" for _ in range(3))\n                       for _ in range(5)]\n            mapped = map_palette(colours, DEFAULTS)\n            for surface in (\"surface\", \"surfaceMuted\", \"sidebar\", \"titlebar\"):\n                for ink in (\"text\", \"textMuted\", \"link\"):\n                    self.assertGreaterEqual(contrast_ratio(mapped[ink], mapped[surface]), 4.5,\n                                            (colours, surface, ink))\n\n    def test_invalid_palette_or_parameters_are_rejected(self):\n        with self.assertRaises(ValueError):\n            map_palette([\"#ffffff\"] * 4, DEFAULTS)\n        with self.assertRaises(ValueError):\n            map_palette([\"#ffffff\"] * 4 + [\"red\"], DEFAULTS)\n        with self.assertRaises(ValueError):\n            map_palette([\"#ffffff\"] * 5, DEFAULTS | {\"glow\": float(\"nan\")})\n\n    def test_wallpaper_contains_all_colours_and_css_uses_working_tokens(self):\n        colours = palette_for(DEFAULTS)\n        css = render_css(map_palette(colours, DEFAULTS), colours, DEFAULTS)\n        for colour in colours:\n            self.assertIn(colour, css)\n        self.assertIn(\"--app-wallpaper:\", css)\n        self.assertNotIn(\"--demo-spooky\", css)\n        self.assertEqual(css.count(\"{\"), css.count(\"}\"))\n        self.assertEqual(css.count(\"/*\"), css.count(\"*/\"))\n        example_tokens = set().union(*(set(re.findall(r\"(?m)^\\s*(--[a-z0-9-]+)\\s*:\", path.read_text()))\n                                       for path in EXAMPLES))\n        generated_tokens = set(re.findall(r\"(?m)^\\s*(--[a-z0-9-]+)\\s*:\", css))\n        self.assertTrue(generated_tokens <= example_tokens, generated_tokens - example_tokens)\n        for line in css.splitlines():\n            if re.match(r\"\\s*--[a-z0-9-]+\\s*:\", line):\n                self.assertTrue(line.rstrip().endswith(\";\"), line)\n\n\nclass ThemeCliTests(unittest.TestCase):\n    def run_theme(self, *arguments, out: Path, previous: Path, previous_name=\"zen-ink\"):\n        with tempfile.TemporaryDirectory() as temporary:\n            directory = Path(temporary)\n            log = directory / \"calls.jsonl\"\n            fake_tv = directory / \"tv\"\n            fake_tv.write_text(\n                \"#!/usr/bin/env python3\\n\"\n                \"import json, os, sys\\n\"\n                \"from pathlib import Path\\n\"\n                \"args = sys.argv[1:]\\n\"\n                \"with open(os.environ['TV_STUB_LOG'], 'a') as log: log.write(json.dumps(args) + '\\\\n')\\n\"\n                \"if args[0] == 'list-artifacts':\\n\"\n                \" print(json.dumps({'artifacts': [{'id': 'other', 'kind': 'path', 'path': '/tmp/other'}, \"\n                \"{'id': 'right', 'kind': 'path', 'path': str(Path(os.environ['DEMO_FOLDER'])) + '/'}]}))\\n\"\n                \"elif args[:3] == ['resource', 'json', 'get']:\\n\"\n                \" print(json.dumps({'exists': True, 'value': json.loads(os.environ['TV_STUB_STATE'])}))\\n\"\n                \"elif args[0] == 'focus-status':\\n\"\n                \" print(json.dumps({'activeThemeName': os.environ['TV_PREVIOUS_NAME']}))\\n\"\n                \"else: print('ok')\\n\"\n            )\n            fake_tv.chmod(0o755)\n            colours = palette_for(DEFAULTS)\n            env = os.environ | {\n                \"PATH\": str(directory) + os.pathsep + os.environ.get(\"PATH\", \"\"),\n                \"TV_STUB_LOG\": str(log),\n                \"TV_STUB_STATE\": json.dumps({\"params\": DEFAULTS, \"palette\": colours}),\n                \"TV_PREVIOUS_NAME\": previous_name,\n                \"DEMO_FOLDER\": str(ROOT),\n                \"TUNE_THEME_PREVIOUS_FILE\": str(previous),\n            }\n            result = subprocess.run([str(ROOT / \"theme\"), \"--out\", str(out), *arguments],\n                                    env=env, capture_output=True, text=True, check=False)\n            calls = [json.loads(line) for line in log.read_text().splitlines()] if log.exists() else []\n            return result, calls, colours\n\n    def test_no_apply_writes_complete_package_without_selection_calls(self):\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            out = root / \"theme\"\n            previous = root / \"previous\"\n            result, calls, colours = self.run_theme(\"--no-apply\", out=out, previous=previous)\n            self.assertEqual(result.returncode, 0, result.stderr)\n            self.assertEqual([call[0] for call in calls], [\"list-artifacts\", \"resource\"])\n            self.assertFalse(previous.exists())\n            manifest = json.loads((out / \"manifest.json\").read_text())\n            self.assertEqual(manifest[\"name\"], \"Colour study\")\n            self.assertIn(manifest[\"colorScheme\"], (\"dark\", \"light\"))\n            self.assertEqual(result.stdout.strip(), \"demo-colour-study \" + \" \".join(colours))\n            self.assertIn(\"--app-wallpaper:\", (out / \"theme.css\").read_text())\n            self.assertIn(\"Generated from the live Colour study card\", (out / \"README.md\").read_text())\n\n    def test_apply_saves_original_once_and_sets_fixed_theme_id(self):\n        with tempfile.TemporaryDirectory() as temporary:\n            root = Path(temporary)\n            out = root / \"theme\"\n            previous = root / \"previous\"\n            first, calls, _ = self.run_theme(out=out, previous=previous)\n            self.assertEqual(first.returncode, 0, first.stderr)\n            self.assertEqual([call[0] for call in calls],\n                             [\"list-artifacts\", \"resource\", \"focus-status\", \"set-theme\"])\n            self.assertEqual(calls[-1], [\"set-theme\", \"demo-colour-study\"])\n            self.assertEqual(previous.read_text(), \"zen-ink\\n\")\n            second, calls, _ = self.run_theme(out=out, previous=previous, previous_name=\"other-theme\")\n            self.assertEqual(second.returncode, 0, second.stderr)\n            self.assertEqual([call[0] for call in calls], [\"list-artifacts\", \"resource\", \"set-theme\"])\n            self.assertEqual(previous.read_text(), \"zen-ink\\n\")\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "tune/test_tune.py": "\"\"\"Exercise the agent-facing tune command through a stub Television CLI.\"\"\"\n\nimport colorsys\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport tempfile\nimport unittest\n\nfrom tune_state import DEFAULTS, PRESETS, palette_for, parse_assignments\n\n\nROOT = Path(__file__).resolve().parent\n\n\nclass ParameterTests(unittest.TestCase):\n    def test_assignments_validate_names_numbers_and_clamp(self):\n        self.assertEqual(parse_assignments([\"colour=0.6\", \"variety=2\", \"grain=-1\"]),\n                         {\"colour\": 0.6, \"variety\": 1.0, \"grain\": 0.0})\n        for argument in (\"nope=0.4\", \"speed=wow\", \"speed=nan\", \"speed\", \"=0.2\"):\n            with self.subTest(argument=argument), self.assertRaises(ValueError):\n                parse_assignments([argument])\n        with self.assertRaises(ValueError):\n            parse_assignments([])\n\n    def test_presets_have_every_parameter_and_palette_has_five_hex_colours(self):\n        for name, params in PRESETS.items():\n            with self.subTest(name=name):\n                self.assertEqual(set(params), set(DEFAULTS))\n                self.assertTrue(all(0 <= value <= 1 for value in params.values()))\n                self.assertEqual(len(palette_for(params)), 5)\n                self.assertTrue(all(len(colour) == 7 and colour.startswith(\"#\")\n                                    for colour in palette_for(params)))\n\n    def test_variety_preserves_family_at_zero_and_adds_a_contrasting_accent(self):\n        family = palette_for(DEFAULTS | {\"variety\": 0})\n        self.assertEqual(family, [\"#063937\", \"#0e5b7e\", \"#175fcc\", \"#4957eb\", \"#a88ef2\"])\n        ocean = palette_for(PRESETS[\"ocean\"])\n        def hue(colour):\n            rgb = [int(colour[index:index + 2], 16) / 255 for index in (1, 3, 5)]\n            return colorsys.rgb_to_hls(*rgb)[0]\n        self.assertTrue(all(0.43 < hue(ocean[index]) < 0.64 for index in (0, 1, 2, 4)))\n        self.assertTrue(hue(ocean[3]) < 0.12 or hue(ocean[3]) > 0.95)\n        rotated = palette_for(PRESETS[\"ocean\"] | {\"colour\": 0.63})\n        self.assertTrue(all(abs((hue(after) - hue(before)) % 1 - 0.1) < 0.01\n                            for before, after in zip(ocean, rotated)))\n        ember = palette_for(PRESETS[\"ember\"])\n        self.assertTrue(all(hue(colour) < 0.24 or hue(colour) > 0.94 for colour in ember))\n        storm = palette_for(PRESETS[\"storm\"])\n        self.assertGreater(abs(hue(storm[3]) - hue(storm[2])), 0.3)\n\n\nclass TuneCliTests(unittest.TestCase):\n    def run_tune(self, *arguments, state=None):\n        with tempfile.TemporaryDirectory() as temporary:\n            directory = Path(temporary)\n            log = directory / \"calls.jsonl\"\n            fake_tv = directory / \"tv\"\n            fake_tv.write_text(\n                \"#!/usr/bin/env python3\\n\"\n                \"import json, os, sys\\n\"\n                \"from pathlib import Path\\n\"\n                \"args = sys.argv[1:]\\n\"\n                \"with open(os.environ['TV_STUB_LOG'], 'a') as log: log.write(json.dumps(args) + '\\\\n')\\n\"\n                \"if args[0] == 'list-artifacts':\\n\"\n                \" print(json.dumps({'artifacts': [{'id': 'other', 'kind': 'path', 'path': '/tmp/other'}, \"\n                \"{'id': 'tune-id', 'kind': 'path', 'path': str(Path(os.environ['DEMO_FOLDER'])) + '/'}]}))\\n\"\n                \"elif args[2] == 'get': print(json.dumps({'exists': True, 'value': json.loads(os.environ['TV_STUB_STATE'])}))\\n\"\n                \"else: print('updated')\\n\"\n            )\n            fake_tv.chmod(0o755)\n            env = os.environ | {\n                \"PATH\": str(directory) + os.pathsep + os.environ.get(\"PATH\", \"\"),\n                \"TV_STUB_LOG\": str(log),\n                \"TV_STUB_STATE\": json.dumps(state or {\"params\": DEFAULTS, \"palette\": palette_for(DEFAULTS), \"saved\": {}}),\n                \"DEMO_FOLDER\": str(ROOT),\n            }\n            result = subprocess.run([str(ROOT / \"tune\"), *arguments], env=env,\n                                    capture_output=True, text=True, check=False)\n            calls = [json.loads(line) for line in log.read_text().splitlines()] if log.exists() else []\n            return result, calls\n\n    def test_get_palette_and_saved_read_store(self):\n        state = {\"params\": DEFAULTS, \"palette\": palette_for(DEFAULTS),\n                 \"saved\": {\"one\": {\"name\": \"Ember dusk\", \"params\": DEFAULTS,\n                                   \"palette\": palette_for(DEFAULTS), \"savedAt\": 1000}}}\n        for command, expected in ((\"get\", DEFAULTS), (\"palette\", state[\"palette\"]),\n                                  (\"saved\", state[\"saved\"])):\n            result, calls = self.run_tune(command, state=state)\n            self.assertEqual(result.returncode, 0, result.stderr)\n            self.assertEqual(json.loads(result.stdout), expected)\n            self.assertEqual([call[0] for call in calls], [\"list-artifacts\", \"resource\"])\n\n    def test_get_and_palette_show_variety_for_an_existing_seven_control_store(self):\n        old_params = {name: value for name, value in DEFAULTS.items() if name != \"variety\"}\n        old_state = {\"params\": old_params, \"palette\": [\"#000000\"] * 5, \"saved\": {}}\n        result, _ = self.run_tune(\"get\", state=old_state)\n        self.assertEqual(result.returncode, 0, result.stderr)\n        self.assertEqual(json.loads(result.stdout), DEFAULTS)\n        result, _ = self.run_tune(\"palette\", state=old_state)\n        self.assertEqual(result.returncode, 0, result.stderr)\n        self.assertEqual(json.loads(result.stdout), palette_for(DEFAULTS))\n\n    def test_set_merges_and_writes_params_with_matching_palette(self):\n        result, calls = self.run_tune(\"set\", \"colour=0.6\", \"variety=1.4\", \"swirl=0.9\")\n        self.assertEqual(result.returncode, 0, result.stderr)\n        self.assertEqual(calls[-1][:5], [\"resource\", \"json\", \"update\", \"--artifact\", \"tune-id\"])\n        payload = json.loads(calls[-1][-1])\n        expected = DEFAULTS | {\"colour\": 0.6, \"variety\": 1.0, \"swirl\": 0.9}\n        self.assertEqual(payload, {\"params\": expected, \"palette\": palette_for(expected)})\n\n    def test_presets_reset_and_rejected_input(self):\n        for arguments, expected in (([\"preset\", \"storm\"], PRESETS[\"storm\"]),\n                                    ([\"reset\"], DEFAULTS)):\n            result, calls = self.run_tune(*arguments)\n            self.assertEqual(result.returncode, 0, result.stderr)\n            self.assertEqual(json.loads(calls[-1][-1]),\n                             {\"params\": expected, \"palette\": palette_for(expected)})\n        for arguments in ((\"set\", \"unknown=0.5\"), (\"preset\", \"unknown\")):\n            result, calls = self.run_tune(*arguments)\n            self.assertNotEqual(result.returncode, 0)\n            self.assertFalse(any(call[:3] == [\"resource\", \"json\", \"update\"] for call in calls))\n\n\nif __name__ == \"__main__\":\n    unittest.main()\n", "tune/theme": "#!/usr/bin/env python3\n\"\"\"Turn this card's live palette into the active Television display theme.\"\"\"\n\nimport argparse\nimport json\nimport os\nfrom pathlib import Path\nimport subprocess\nimport sys\nimport tempfile\n\nfrom theme_style import map_palette, render_css\nfrom tune_state import DEFAULTS\n\n\nFOLDER = Path(__file__).resolve().parent\nTHEME_ID = \"demo-colour-study\"\nDEFAULT_OUT = Path(\"/root/.television/themes\") / THEME_ID\nPREVIOUS_FILE = FOLDER.parent / \".previous-theme\"\n\n\ndef tv(*arguments: str) -> str:\n    \"\"\"Run the Television CLI with the same error surface as tune.\"\"\"\n    result = subprocess.run([\"tv\", *arguments], capture_output=True, text=True, check=False)\n    if result.returncode:\n        raise RuntimeError(result.stderr.strip() or result.stdout.strip() or \"tv command failed\")\n    return result.stdout.strip()\n\n\ndef artifact_id() -> str:\n    \"\"\"Resolve the one path artifact registered for this folder.\"\"\"\n    response = json.loads(tv(\"list-artifacts\"))\n    matches = [artifact for artifact in response.get(\"artifacts\", [])\n               if artifact.get(\"kind\") == \"path\"\n               and Path(artifact.get(\"path\", \"\")).resolve() == FOLDER]\n    if len(matches) == 1:\n        return matches[0][\"id\"]\n    if matches:\n        raise RuntimeError(f\"Several Television artifacts point at {FOLDER}; keep one for this demo.\")\n    raise RuntimeError(f\"No Television path artifact points at {FOLDER}. Register the card first.\")\n\n\ndef read_store(identifier: str) -> tuple[list[str], dict]:\n    \"\"\"Read the five colours and parameters from this card's shared store.\"\"\"\n    response = json.loads(tv(\"resource\", \"json\", \"get\", \"--artifact\", identifier))\n    if not response.get(\"exists\"):\n        raise ValueError(\"The Colour study store is empty; open the card first\")\n    state = response[\"value\"]\n    if not isinstance(state, dict) or not isinstance(state.get(\"params\"), dict):\n        raise ValueError(\"The Colour study store has an unexpected shape\")\n    return state.get(\"palette\"), {**DEFAULTS, **state[\"params\"]}\n\n\ndef atomic_write(path: Path, contents: str) -> None:\n    \"\"\"Replace one watched theme file after its complete contents are ready.\"\"\"\n    with tempfile.NamedTemporaryFile(\"w\", encoding=\"utf-8\", dir=path.parent, delete=False) as temporary:\n        temporary.write(contents)\n        temporary_path = Path(temporary.name)\n    try:\n        os.replace(temporary_path, path)\n    finally:\n        temporary_path.unlink(missing_ok=True)\n\n\ndef write_package(out: Path, manifest: dict, css: str) -> None:\n    \"\"\"Write the fixed theme ID, protecting a folder with another manifest.\"\"\"\n    if out.exists() and any(out.iterdir()):\n        if not (out / \"manifest.json\").exists():\n            raise ValueError(f\"Refusing to replace an unrecognized theme folder at {out}\")\n        existing = json.loads((out / \"manifest.json\").read_text())\n        if existing.get(\"name\") != \"Colour study\":\n            raise ValueError(f\"Refusing to replace a different theme at {out}\")\n    out.mkdir(parents=True, exist_ok=True)\n    atomic_write(out / \"theme.css\", css)\n    atomic_write(out / \"manifest.json\", json.dumps(manifest, indent=2) + \"\\n\")\n    record = out / \"README.md\"\n    if not record.exists():\n        atomic_write(record, \"# Colour study theme\\n\\n\"\n                     \"Generated from the live Colour study card by `tune/theme`. \"\n                     \"The palette supplies the wallpaper and UI accents; surfaces and text \"\n                     \"are adjusted to maintain at least 4.5:1 contrast. \"\n                     \"Running the helper again replaces `manifest.json` and `theme.css`.\\n\")\n\n\ndef save_previous_theme(path: Path) -> None:\n    \"\"\"Record the original selection once, before first activation.\"\"\"\n    if path.exists():\n        return\n    current = json.loads(tv(\"focus-status\")).get(\"activeThemeName\")\n    with path.open(\"x\", encoding=\"utf-8\") as record:\n        record.write((current if isinstance(current, str) else \"none\") + \"\\n\")\n\n\ndef main() -> int:\n    \"\"\"Read the card, create its theme package, and optionally activate it.\"\"\"\n    parser = argparse.ArgumentParser(description=__doc__)\n    parser.add_argument(\"--out\", type=Path, default=DEFAULT_OUT, help=\"Theme folder (for tests)\")\n    parser.add_argument(\"--no-apply\", action=\"store_true\", help=\"Write files without selecting the theme\")\n    arguments = parser.parse_args()\n    try:\n        palette, params = read_store(artifact_id())\n        roles = map_palette(palette, params)\n        manifest = {\"name\": \"Colour study\", \"version\": \"1.0.0\", \"colorScheme\": roles[\"scheme\"]}\n        write_package(arguments.out, manifest, render_css(roles, palette, params))\n        if not arguments.no_apply:\n            # The override exists only so tests never touch the real repo backup.\n            previous = Path(os.environ.get(\"TUNE_THEME_PREVIOUS_FILE\", PREVIOUS_FILE))\n            save_previous_theme(previous)\n            tv(\"set-theme\", THEME_ID)\n        print(f\"{THEME_ID} {' '.join(palette)}\")\n    except (OSError, ValueError, KeyError, json.JSONDecodeError, RuntimeError) as error:\n        print(f\"theme: {error}\", file=sys.stderr)\n        return 1\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "tune/theme_style.py": "\"\"\"Map five card colours into a readable fixed Television theme.\n\nThe palette supplies hue and the app wallpaper. Surface and text roles are\nnudged toward black or white as needed so every body-text pair clears WCAG AA.\n\"\"\"\n\nimport colorsys\nimport math\nimport re\n\n\nHEX_COLOUR = re.compile(r\"#[0-9a-fA-F]{6}\\Z\")\n\n\ndef channels(colour: str) -> tuple[int, int, int]:\n    \"\"\"Parse one validated #rrggbb colour.\"\"\"\n    if not isinstance(colour, str) or not HEX_COLOUR.fullmatch(colour):\n        raise ValueError(f\"Invalid palette colour: {colour!r}\")\n    return tuple(int(colour[index:index + 2], 16) for index in (1, 3, 5))\n\n\ndef colour_from_channels(values: tuple[float, float, float]) -> str:\n    \"\"\"Format clamped RGB channels as a CSS hex colour.\"\"\"\n    return \"#\" + \"\".join(f\"{round(max(0, min(255, value))):02x}\" for value in values)\n\n\ndef blend(first: str, second: str, second_weight: float) -> str:\n    \"\"\"Blend two palette colours in sRGB for subdued interface materials.\"\"\"\n    left, right = channels(first), channels(second)\n    return colour_from_channels(tuple(a * (1 - second_weight) + b * second_weight\n                                      for a, b in zip(left, right)))\n\n\ndef luminance(colour: str) -> float:\n    \"\"\"Return WCAG relative luminance for a hex colour.\"\"\"\n    def linear(channel: int) -> float:\n        value = channel / 255\n        return value / 12.92 if value <= 0.04045 else ((value + 0.055) / 1.055) ** 2.4\n    red, green, blue = (linear(channel) for channel in channels(colour))\n    return 0.2126 * red + 0.7152 * green + 0.0722 * blue\n\n\ndef contrast_ratio(first: str, second: str) -> float:\n    \"\"\"Return WCAG contrast ratio, with 4.5 as the normal-text floor.\"\"\"\n    brighter, darker = sorted((luminance(first), luminance(second)), reverse=True)\n    return (brighter + 0.05) / (darker + 0.05)\n\n\ndef contrasting(source: str, grounds: tuple[str, ...], dark: bool) -> str:\n    \"\"\"Move only HLS lightness until source reads on every supplied ground.\"\"\"\n    red, green, blue = (channel / 255 for channel in channels(source))\n    hue, lightness, saturation = colorsys.rgb_to_hls(red, green, blue)\n    def at(value: float) -> str:\n        rgb = colorsys.hls_to_rgb(hue, value, saturation)\n        return colour_from_channels(tuple(component * 255 for component in rgb))\n    if all(contrast_ratio(source, ground) >= 4.5 for ground in grounds):\n        return source.lower()\n    low, high = (lightness, 1.0) if dark else (0.0, lightness)\n    for _ in range(24):\n        middle = (low + high) / 2\n        if all(contrast_ratio(at(middle), ground) >= 4.5 for ground in grounds):\n            if dark:\n                high = middle\n            else:\n                low = middle\n        elif dark:\n            low = middle\n        else:\n            high = middle\n    return at(high if dark else low)\n\n\ndef map_palette(palette: list[str], params: dict) -> dict[str, str]:\n    \"\"\"Assign palette colours to readable application roles and one scheme.\"\"\"\n    if not isinstance(palette, list) or len(palette) != 5:\n        raise ValueError(\"The store needs exactly five palette colours\")\n    for colour in palette:\n        channels(colour)\n    palette = [colour.lower() for colour in palette]\n    if not isinstance(params, dict) or any(\n        isinstance(params.get(name), bool)\n        or not isinstance(params.get(name), (int, float))\n        or not math.isfinite(params[name])\n        or not 0 <= params[name] <= 1\n        for name in (\"glow\", \"variety\")\n    ):\n        raise ValueError(\"The store needs 0..1 glow and variety parameters\")\n    dark = sum(luminance(colour) < 0.36 for colour in palette) >= 3\n    ordered = sorted(palette, key=luminance)\n    # A three-of-five vote can choose dark even when its darkest member is\n    # mid-bright. Keep the palette hue but move the grounds far enough from\n    # white (or black) that readable text is always possible.\n    pole = \"#ffffff\" if dark else \"#000000\"\n    def fit_ground(colour: str) -> str:\n        return contrasting(colour, (pole,), not dark)\n    if dark:\n        surface = fit_ground(blend(ordered[0], \"#000000\", 0.14))\n        muted = fit_ground(blend(surface, ordered[1], 0.35))\n        text_source = blend(ordered[-1], \"#ffffff\", 0.80)\n    else:\n        surface = fit_ground(blend(ordered[-1], \"#ffffff\", 0.32))\n        muted = fit_ground(blend(surface, ordered[-2], 0.30))\n        text_source = blend(ordered[0], \"#000000\", 0.70)\n    sidebar = muted\n    titlebar = fit_ground(blend(surface, muted, 0.55))\n    grounds = (surface, muted, sidebar, titlebar)\n    text = contrasting(text_source, grounds, dark)\n    text_muted = contrasting(blend(text, surface, 0.30), grounds, dark)\n    saturated = sorted(palette, key=lambda colour: colorsys.rgb_to_hls(\n        *(channel / 255 for channel in channels(colour)))[2], reverse=True)\n    accent = contrasting(saturated[0], grounds, dark)\n    link = contrasting(saturated[1], grounds, dark)\n    selected_text = max((\"#10131a\", \"#ffffff\"), key=lambda colour: contrast_ratio(colour, accent))\n    border = blend(surface, text, 0.22 if dark else 0.18)\n    return {\n        \"scheme\": \"dark\" if dark else \"light\", \"surface\": surface, \"surfaceMuted\": muted,\n        \"sidebar\": sidebar, \"titlebar\": titlebar, \"text\": text,\n        \"textMuted\": text_muted, \"accent\": accent, \"link\": link,\n        \"channelSelectedText\": selected_text, \"border\": border,\n    }\n\n\ndef render_css(roles: dict[str, str], palette: list[str], params: dict) -> str:\n    \"\"\"Render only documented tokens used by working Television themes.\"\"\"\n    colour = [value.lower() for value in palette]\n    glow = max(0.0, min(1.0, params[\"glow\"]))\n    variety = max(0.0, min(1.0, params[\"variety\"]))\n    strength = round(50 + 12 * glow)\n    angle = round(125 + 35 * variety)\n    stops = \", \".join(\n        f\"color-mix(in srgb, {value} {strength}%, {roles['surface']}) {index * 25}%\"\n        for index, value in enumerate(colour)\n    )\n    shadow_alpha = \"42%\" if roles[\"scheme\"] == \"dark\" else \"18%\"\n    return f\"\"\"/* Generated by Colour study from its live five-colour store. */\n:root {{\n  --color-surface: {roles['surface']};\n  --color-surface-muted: {roles['surfaceMuted']};\n  --color-text: {roles['text']};\n  --color-text-muted: {roles['textMuted']};\n  --accent: {roles['accent']};\n  --color-link: {roles['link']};\n  --color-border: {roles['border']};\n  --panel-border: 1px solid {roles['border']};\n  --shadow-sm: 0 2px 6px rgb(0 0 0 / {shadow_alpha});\n  --shadow-md: 0 7px 18px rgb(0 0 0 / {shadow_alpha});\n  --shadow-lg: 0 18px 36px rgb(0 0 0 / {shadow_alpha});\n}}\n\n:root[data-television-document=\"app\"] {{\n  --sidebar-background: {roles['sidebar']};\n  --sidebar-text-color: {roles['text']};\n  --sidebar-heading-text-color: {roles['textMuted']};\n  --sidebar-border: 1px solid {roles['border']};\n  --app-wallpaper: linear-gradient({angle}deg, {stops});\n  --wallpaper-overlay-background: {roles['surface']};\n  --wallpaper-overlay-text-color: {roles['text']};\n  --navbar-text-color: {roles['text']};\n  --channel-background-selected: {roles['accent']};\n  --channel-text-color-selected: {roles['channelSelectedText']};\n  --tab-text-color: {roles['textMuted']};\n  --tab-background-selected: {roles['surfaceMuted']};\n  --tab-text-color-selected: {roles['text']};\n  --tab-border-selected: 1px solid {roles['border']};\n  --frame-background: {roles['surface']};\n  --frame-border: 1px solid {roles['border']};\n  --frame-titlebar-background: {roles['titlebar']};\n  --frame-titlebar-text-color: {roles['text']};\n  --frame-titlebar-border-color: {roles['border']};\n  --artifact-frame-shadow: 0 20px 48px rgb(0 0 0 / {shadow_alpha});\n}}\n\n/* The collapsed channel picker has its own selected-row colours. */\n:root[data-television-document=\"app\"] .channel-switcher-pop {{\n  --channel-background-selected: {roles['accent']};\n  --channel-text-color-selected: {roles['channelSelectedText']};\n}}\n\"\"\"\n", "tune/tune": "#!/usr/bin/env python3\n\"\"\"Read and tune one Television generative art card by meaning or by number.\"\"\"\n\nimport argparse\nimport json\nfrom pathlib import Path\nimport subprocess\nimport sys\n\nfrom tune_state import DEFAULTS, PRESETS, palette_for, parse_assignments\n\n\nFOLDER = Path(__file__).resolve().parent\n\n\ndef tv(*arguments: str) -> str:\n    \"\"\"Run the Television CLI and expose its actual failure message.\"\"\"\n    result = subprocess.run([\"tv\", *arguments], capture_output=True, text=True, check=False)\n    if result.returncode:\n        raise RuntimeError(result.stderr.strip() or result.stdout.strip() or \"tv command failed\")\n    return result.stdout.strip()\n\n\ndef artifact_id() -> str:\n    \"\"\"Find the registered path artifact that points to this helper's folder.\"\"\"\n    response = json.loads(tv(\"list-artifacts\"))\n    matches = [artifact for artifact in response.get(\"artifacts\", [])\n               if artifact.get(\"kind\") == \"path\"\n               and Path(artifact.get(\"path\", \"\")).resolve() == FOLDER]\n    if len(matches) == 1:\n        return matches[0][\"id\"]\n    if matches:\n        raise RuntimeError(f\"Several Television artifacts point at {FOLDER}; keep one for this demo.\")\n    raise RuntimeError(f\"No Television path artifact points at {FOLDER}. Register the card first.\")\n\n\ndef read_state(identifier: str) -> dict:\n    \"\"\"Read the shared root, using defaults if the page has not opened yet.\"\"\"\n    response = json.loads(tv(\"resource\", \"json\", \"get\", \"--artifact\", identifier))\n    if not response.get(\"exists\"):\n        return {\"params\": DEFAULTS, \"palette\": palette_for(DEFAULTS), \"saved\": {}}\n    state = response[\"value\"]\n    if not isinstance(state, dict) or not isinstance(state.get(\"params\"), dict):\n        raise ValueError(\"The tune store has an unexpected shape\")\n    had_variety = \"variety\" in state[\"params\"]\n    state[\"params\"] = {**DEFAULTS, **state[\"params\"]}\n    if not had_variety:\n        state[\"palette\"] = palette_for(state[\"params\"])\n    return state\n\n\ndef write_params(identifier: str, params: dict) -> None:\n    \"\"\"Keep the rendered parameters and exported palette in one store update.\"\"\"\n    tv(\"resource\", \"json\", \"update\", \"--artifact\", identifier,\n       json.dumps({\"params\": params, \"palette\": palette_for(params)}))\n\n\ndef parse_arguments(argv: list[str]) -> argparse.Namespace:\n    \"\"\"Parse the small command set exposed to a stage agent.\"\"\"\n    parser = argparse.ArgumentParser(description=__doc__)\n    commands = parser.add_subparsers(dest=\"command\", required=True)\n    for command in (\"get\", \"palette\", \"saved\", \"reset\"):\n        commands.add_parser(command)\n    change = commands.add_parser(\"set\", help=\"Set 0..1 controls, including variety\")\n    change.add_argument(\"assignments\", nargs=\"+\")\n    preset = commands.add_parser(\"preset\", help=\"Apply a named mood\")\n    preset.add_argument(\"name\", choices=PRESETS)\n    return parser.parse_args(argv)\n\n\ndef main() -> int:\n    \"\"\"Execute a command after resolving this folder's artifact and store.\"\"\"\n    arguments = parse_arguments(sys.argv[1:])\n    try:\n        identifier = artifact_id()\n        state = read_state(identifier)\n        if arguments.command == \"get\":\n            print(json.dumps(state[\"params\"], indent=2))\n        elif arguments.command == \"palette\":\n            print(json.dumps(state.get(\"palette\") or palette_for(state[\"params\"]), indent=2))\n        elif arguments.command == \"saved\":\n            print(json.dumps(state.get(\"saved\") or {}, indent=2))\n        else:\n            if arguments.command == \"set\":\n                params = {**DEFAULTS, **state[\"params\"], **parse_assignments(arguments.assignments)}\n            elif arguments.command == \"preset\":\n                params = PRESETS[arguments.name].copy()\n            else:\n                params = DEFAULTS.copy()\n            write_params(identifier, params)\n            print(json.dumps(params, indent=2))\n    except (OSError, ValueError, KeyError, json.JSONDecodeError, RuntimeError) as error:\n        print(f\"tune: {error}\", file=sys.stderr)\n        return 1\n    return 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n", "tune/tune_state.py": "\"\"\"Pure parameter rules for the agent CLI and the card's matching palette math.\n\nAll eight controls use 0..1. The palette is deterministic, so an agent write can\ninclude its swatches atomically even when nobody has the page open.\n\"\"\"\n\nimport colorsys\nimport math\n\n\nDEFAULTS = {\n    \"colour\": 0.60, \"spread\": 0.48, \"variety\": 0.68, \"speed\": 0.34, \"swirl\": 0.52,\n    \"scale\": 0.52, \"glow\": 0.54, \"grain\": 0.28,\n}\n\nPRESETS = {\n    \"dusk\": {\"colour\": 0.78, \"spread\": 0.38, \"variety\": 0.48, \"speed\": 0.24, \"swirl\": 0.38,\n             \"scale\": 0.61, \"glow\": 0.43, \"grain\": 0.32},\n    \"ocean\": {\"colour\": 0.53, \"spread\": 0.34, \"variety\": 0.95, \"speed\": 0.27, \"swirl\": 0.53,\n              \"scale\": 0.54, \"glow\": 0.51, \"grain\": 0.20},\n    \"ember\": {\"colour\": 0.06, \"spread\": 0.34, \"variety\": 0.18, \"speed\": 0.48, \"swirl\": 0.59,\n              \"scale\": 0.44, \"glow\": 0.77, \"grain\": 0.38},\n    \"calm\": {\"colour\": 0.42, \"spread\": 0.22, \"variety\": 0.07, \"speed\": 0.12, \"swirl\": 0.18,\n             \"scale\": 0.77, \"glow\": 0.42, \"grain\": 0.12},\n    \"storm\": {\"colour\": 0.64, \"spread\": 0.60, \"variety\": 1.0, \"speed\": 0.78, \"swirl\": 0.91,\n              \"scale\": 0.35, \"glow\": 0.67, \"grain\": 0.51},\n}\n\n\ndef parse_assignments(assignments: list[str]) -> dict[str, float]:\n    \"\"\"Validate a nonempty sequence of name=value arguments, clamping 0..1.\"\"\"\n    if not assignments:\n        raise ValueError(\"Give at least one name=value pair\")\n    changes = {}\n    for assignment in assignments:\n        name, separator, raw = assignment.partition(\"=\")\n        if not separator or name not in DEFAULTS:\n            raise ValueError(f\"Unknown or malformed parameter: {assignment}\")\n        try:\n            value = float(raw)\n        except ValueError as error:\n            raise ValueError(f\"{name} needs a number\") from error\n        if not math.isfinite(value):\n            raise ValueError(f\"{name} needs a finite number\")\n        changes[name] = round(min(1.0, max(0.0, value)), 4)\n    return changes\n\n\ndef palette_for(params: dict[str, float]) -> list[str]:\n    \"\"\"Build the five shader colours from colour, spread, variety and glow.\"\"\"\n    hue = params[\"colour\"]\n    spread = params[\"spread\"]\n    variety = params[\"variety\"]\n    glow = params[\"glow\"]\n    saturation = 0.68 + 0.22 * glow\n    colours = []\n    for index, offset in enumerate((-0.22, -0.10, 0.0, 0.11, 0.23)):\n        family_offset = offset * spread\n        if index == 0:\n            offset = family_offset - variety * 0.02\n        elif index == 3:\n            offset = family_offset * (1 - variety) + 0.5 * variety\n        elif index == 4:\n            offset = family_offset + variety * 0.015\n        else:\n            offset = family_offset\n        colour_hue = (hue + offset) % 1\n        lightness = min(0.9, (0.12, 0.27, 0.44, 0.60, 0.75)[index] + (glow - 0.5) * 0.10)\n        red, green, blue = colorsys.hls_to_rgb(colour_hue, lightness, saturation)\n        colours.append(\"#\" + \"\".join(f\"{int(channel * 255 + 0.5):02x}\" for channel in (red, green, blue)))\n    return colours\n", "room-line/README.md": "# Room line\n\nThis relay turns one-word submissions from a public Tally form into new pile magnets on the Fridge poetry card. It optionally asks a tool-free Claude process for a short face reaction. It does not send anything to Dispatch.\n\n## Before the room arrives\n\nRegister and open the Fridge poetry and Face cards in Television. Opening the fridge initializes its JSON store. `config.json` points at the public word form. For a different form, replace `formId` and `questionFieldId` with the Tally form ID and the ID of its word question. Put the public URL for that form behind the QR code shown to the room. This relay reads submissions only; it never creates, edits, or submits a form.\n\nRun from this folder:\n\n```sh\nop run --env-file=/root/env/tv-demo-tally.env.op -- ./room-line run\n```\n\nIt polls every 2.5 seconds. Fridge additions continue while the single face worker waits for Claude. By default the first run starts at launch time; later starts resume the saved start time and skip saved submission IDs. To start from a specific time, use `--since 2026-10-14T19:00:00-07:00`. Stop with Ctrl-C. `state.json` and temporary state files are gitignored. They hold form, question, and submission IDs plus timing, never answers. If the configured form or word question changes, the relay starts a new window.\n\n## Safety boundary\n\nThe raw answer stays in the polling process. Plain Python takes only the first token and requires 1 to 16 ASCII letters with at most one internal apostrophe or hyphen. The word is checked against the category files `blocklist-slurs.txt`, `blocklist-profanity.txt`, `blocklist-identity.txt`, `blocklist-politics.txt`, and `blocklist-harm.txt`, plus `blocklist-extra.txt`. Each category file explains `word:` entries, which catch common endings, and `root:` entries, which catch a spelling inside a longer word. The check ignores case, apostrophes, hyphens, and repeated letters. `allowlist.txt` holds a few innocent words caught by a root or ending; listed spellings and simple endings pass, but repeated-letter variants do not. Edit the files before starting the relay; restart to reload them.\n\nBlocked submissions are logged only as `blocked` with their category: the word itself is never printed. Other rejected answers are logged by reason. No rejected answer goes to the fridge, model, or face. An accepted word goes to the fridge through `tv resource json push` under a fresh key; a duplicate or a word arriving within three seconds of another accepted word is dropped.\n\nFor a reaction, the validated word alone reaches `claude -p` from a fresh `/tmp` directory. Claude gets no tools, MCP servers, custom settings, hooks, skills, CLAUDE.md files, or auto-memory; the process has a six-second deadline and receives no Tally key. Code checks its JSON, line, mood, and every word in the line against the same filter before calling the existing `face say` helper. Any invalid or blocked response, or a timeout, produces a canned line. The face speaks at most once every eight seconds. The relay logs one line per completed submission it handles.\n\n## Rehearsal and checks\n\n```sh\n./room-line check 'Moon glow'\n./room-line react moon\n./room-line add moon\npython3 -m unittest -v test_room_line.py\n```\n\n`check` only validates. `react` calls the locked-down model and prints JSON without touching the face. `add` validates and adds a pile magnet, but does not speak. `sample-submissions.json` records the response shape used by the offline tests. `run --sample sample-submissions.json --since 2026-10-14T19:00:00-07:00 --once` substitutes that file for Tally while still targeting the configured fridge, so use it only on a rehearsal card. The tests stub Television, Claude, and the face, and never call Tally.\n", "room-line/config.json": "{\n  \"formId\": \"Z958J0\",\n  \"questionFieldId\": \"l0AyN6\",\n  \"formTitle\": \"Send the TV a word\",\n  \"shortLink\": \"https://tally.so/r/Z958J0\"\n}\n", "room-line/create-form.py": "#!/usr/bin/env python3\n\"\"\"Create the public \"Send the TV a word\" Tally form and point config.json at it.\n\nRun once with TALLY_API_KEY in the environment, for example\n`op run --env-file=/root/env/tv-demo-tally.env.op -- ./create-form.py`.\nPass --new to make a fresh form when config.json already points at one.\nThe key is used only in process memory and never printed.\n\"\"\"\n\nimport json\nimport os\nimport sys\nimport urllib.error\nimport urllib.request\nimport uuid\nfrom pathlib import Path\n\nHERE = Path(__file__).resolve().parent\nCONFIG = HERE / \"config.json\"\nAPI = \"https://api.tally.so\"\nTITLE = \"Send the TV a word\"\nQUESTION = \"One word for the fridge\"\n\n\ndef request(method, path, data=None):\n    key = os.environ[\"TALLY_API_KEY\"]\n    body = None if data is None else json.dumps(data).encode(\"utf-8\")\n    req = urllib.request.Request(\n        API + path, data=body, method=method,\n        headers={\n            \"Authorization\": \"Bearer \" + key,\n            \"Content-Type\": \"application/json\",\n            \"User-Agent\": \"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36\",\n        },\n    )\n    try:\n        with urllib.request.urlopen(req, timeout=20) as response:\n            payload = response.read()\n            return json.loads(payload) if payload else None\n    except urllib.error.HTTPError as error:\n        raw = error.read().decode(\"utf-8\", errors=\"replace\").replace(key, \"[redacted]\")\n        raise RuntimeError(f\"Tally returned HTTP {error.code} for {method} {path}: {raw[:200]}\") from None\n\n\ndef block(kind, group_type, payload):\n    return {\"uuid\": str(uuid.uuid4()), \"type\": kind, \"groupUuid\": str(uuid.uuid4()),\n            \"groupType\": group_type, \"payload\": payload}\n\n\ndef main():\n    config = json.loads(CONFIG.read_text())\n    if config.get(\"formTitle\") == TITLE and \"--new\" not in sys.argv[1:]:\n        raise RuntimeError(\"config.json already points at a word form; pass --new to create another\")\n    result = request(\"POST\", \"/forms\", {\n        \"status\": \"PUBLISHED\",\n        \"blocks\
