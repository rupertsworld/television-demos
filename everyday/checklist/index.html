<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/canonical/v2/styles.css?authoredForAppVersion=1.5.0">

    <link rel="stylesheet" href="./task.css">
    <script type="module" src="./task.js"></script>

  <body>
    <header>
      <h1>Diff &amp; Demo prep</h1>
      <p>Wednesday, October 14</p>
    </header>
    <tv-task-list>
      <tv-task-section>
        <header><h2>Today</h2></header>
        <tv-task><tv-task-checkbox checked></tv-task-checkbox><tv-task-body><tv-task-title>Pick what to demo</tv-task-title><tv-task-meta><tv-task-meta-tag>talk</tv-task-meta-tag></tv-task-meta></tv-task-body></tv-task>
        <tv-task><tv-task-checkbox checked></tv-task-checkbox><tv-task-body><tv-task-title>Build fridge poetry</tv-task-title><tv-task-note>Drag a word, the agent drags one back.</tv-task-note><tv-task-meta><tv-task-meta-tag>build</tv-task-meta-tag></tv-task-meta></tv-task-body></tv-task>
        <tv-task><tv-task-checkbox checked></tv-task-checkbox><tv-task-body><tv-task-title>Give the TV a face</tv-task-title><tv-task-meta><tv-task-meta-tag>build</tv-task-meta-tag></tv-task-meta></tv-task-body></tv-task>
        <tv-task><tv-task-checkbox checked></tv-task-checkbox><tv-task-body><tv-task-title>Make a form so the room can send words</tv-task-title><tv-task-meta><tv-task-meta-tag>build</tv-task-meta-tag></tv-task-meta></tv-task-body></tv-task>
        <tv-task><tv-task-checkbox></tv-task-checkbox><tv-task-body><tv-task-title>Rehearse the five minutes</tv-task-title><tv-task-meta><tv-task-meta-due date="2026-10-14"></tv-task-meta-due><tv-task-meta-tag>talk</tv-task-meta-tag></tv-task-meta></tv-task-body></tv-task>
        <tv-task><tv-task-checkbox></tv-task-checkbox><tv-task-body><tv-task-title>Don't trip over the projector cable</tv-task-title><tv-task-meta><tv-task-meta-tag>talk</tv-task-meta-tag></tv-task-meta></tv-task-body></tv-task>
      </tv-task-section>
    </tv-task-list>
  </body>
</html>
